<script>
'use strict';
/* =============================================================================
   SECTION 1 — CONTRACTS                       (port: sim/contracts.ts)
   The JS shadow of the Python boundary: GameSpec (docs/game-boundary-design.md,
   frozen), the default_trace dict, and the REGISTRY convention.

   @typedef {Object} Trajectory
     meta:   {gameId, T, N, seed, params, scalars}   — scalars: final metrics
     global: {name: Float64Array[T]}                 — global_attrs series
     node:   {name: Float64Array[T*N]} (row-major)   — node_attrs series
     static: {name: Float64Array[N]}                 — per-agent constants
     adj?:   {name: Float64Array[N*N]}               — reserved: network games
   JSON form: same shape, number[] instead of Float64Array.

   @typedef {Object} GameEngine   — run(params, seed) -> Promise<Trajectory>
     Producers: LocalEngine (in-browser step fn), RemoteEngine (JAX endpoint,
     same JSON over the wire), StaticEngine (precomputed export). Which one a
     game uses is a registry entry, not an architecture decision.

   @typedef {Object} GameSchema   — drives ALL generic UI; the shell renders
     params/mechanisms/presets/views/story/legend/charts/badges from this
     description alone.
     .views  = [{key, label}] — the game's visualizations; the shell renders
       the switcher and delegates to the matching SceneRenderer.
     .story  = [{title, body, view?, t?, playTo?, speed?, annotate?}] — the
       first-run walkthrough. The shell owns the card UI + step transitions;
       annotate(annG, layer, traj) draws hand notes over the scene.
     .legend = [{glyph, label}] — persistent "how to read this" key; glyph
       names come from the shell's small vocabulary (circle, square, packet,
       packetRed, packetBlue, blob, ringBlue).
     .intro  = {seed, presetKey} — the curated first-load run (the default
       run should tell a story, not be statistically typical).
     Preset.overrides restore full param values — a preset is a reproducible
     condition, not a mechanism toggle.

   @typedef {Object} SceneRenderer — the only game-specific UI code. A game
     module ships scenes: {viewKey: SceneRenderer}:
     layout(staticG, traj) -> layer               (rebuilt per run / view switch)
     drawFrame(dynG, layer, traj, t, frac)        (per playback frame; frac ∈
       [0,1) is progress through tick t — message packets slide along edges)
============================================================================= */

const Producers = {
  /** Wrap a pure (params, seed) => Trajectory function. */
  local(fn) { return { run: (params, seed) => Promise.resolve(fn(params, seed)) }; },
  /** Same contract over the wire — a JAX backend slots in without UI changes. */
  remote(endpoint) {
    return { run: (params, seed) =>
      fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ params, seed }) })
        .then((r) => r.json()).then(Trajectories.fromJSON) };
  },
  /** Precomputed export (examples/05_export_trajectory.py) as a producer. */
  static(url) { return { run: () => fetch(url).then((r) => r.json()).then(Trajectories.fromJSON) }; },
};

const Trajectories = {
  fromJSON(j) {
    const lift = (o) => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [k, Float64Array.from(v)]));
    return { meta: j.meta, global: lift(j.global), node: lift(j.node), static: lift(j.static),
             adj: j.adj ? lift(j.adj) : undefined,
             system: j.system };   // v1.1: pipeline DAG from @transform metadata, passed through verbatim
  },
};

/* =============================================================================
   SECTION 2 — PRIMITIVES          (port: sim/engine/{rng,stats,schedule}.ts)
   Pure, DOM-free. mulberry32 matches the site's convention
   (eq-network src/components/lab/visuals/types.ts). JAX Threefry cannot be
   matched bit-for-bit — fidelity is gated by the validation ladder below.
============================================================================= */
/* @core-begin */
function makeRng(seed) {
  let s = seed | 0, spare = null;
  const uniform = () => {
    s = (s + 0x6d2b79f5) | 0;
    let x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  const normal = () => {          // Box–Muller, cached spare
    if (spare !== null) { const v = spare; spare = null; return v; }
    const a = Math.max(uniform(), 1e-12), b = uniform();
    const m = Math.sqrt(-2 * Math.log(a));
    spare = m * Math.sin(2 * Math.PI * b);
    return m * Math.cos(2 * Math.PI * b);
  };
  return { uniform, normal, bernoulli: (p) => uniform() < p };
}

const clip = (x, lo, hi) => Math.min(Math.max(x, lo), hi);

/** Quantile with numpy-style linear interpolation (jnp.quantile semantics). */
function quantile(xs, q) {
  const a = Array.from(xs).sort((p, r) => p - r);
  const pos = q * (a.length - 1), i = Math.floor(pos), frac = pos - i;
  return i + 1 < a.length ? a[i] + frac * (a[i + 1] - a[i]) : a[i];
}

/** Gini = Σᵢⱼ|xᵢ−xⱼ| / (2n²μ)  (metrics/families/concentration.py). */
function gini(xs) {
  const n = xs.length, mu = xs.reduce((p, v) => p + v, 0) / n;
  if (mu <= 1e-12) return 0;
  let s = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) s += Math.abs(xs[i] - xs[j]);
  return s / (2 * n * n * mu);
}

/** Schedule predicate — port of core/schedule.py. Fires when
    step >= onset and (step - phaseOffset) % cadence === 0. */
function fires(step, { cadence = 1, phaseOffset = 0, onset = 0 } = {}) {
  if (step < onset) return false;
  const m = (step - phaseOffset) % cadence;
  return (m + cadence) % cadence === 0;
}

/** Logistic regrowth increment (governed_commons/dynamics.py::make_regrow). */
const logisticGrowth = (R, rate, K) => rate * R * (1 - R / K);
/* @core-end */

/* =============================================================================
   SECTION 3 — SKETCH RENDERER               (port: swap for rough.js +
   sim/shell/sketch.ts helpers over eq-network visuals/types.ts)
   Same trick rough.js uses: seeded two-pass wobbly overdraw. Deterministic per
   (seed) so shapes never shimmer between redraws. Grammar: sketchiness lives
   in agents/data; structural lines (zones, axes) stay plain. For the
   message-passing views: dashed edges with arrowheads, sliding packets, and
   the hatched "system" ellipse from the interface mockups.
============================================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};

const Sketch = {
  ROUGHNESS: 0.8,
  _uid: 0,
  _jitterPts(pts, seed, pass, rough) {
    const r = makeRng((seed * 7919 + pass * 104729) | 0);
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const segs = Math.max(1, Math.round(len / 24));
      for (let sIdx = 0; sIdx < segs; sIdx++) {
        const t = sIdx / segs, w = rough * 1.5 * (r.uniform() * 2 - 1);
        out.push([x1 + dx * t + nx * w, y1 + dy * t + ny * w]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  },
  path(parent, pts, { seed = 1, stroke = '#1e1e1e', width = 1.4, roughness = Sketch.ROUGHNESS,
                      close = false, fill = 'none', opacity = 1, dash = '' } = {}) {
    const g = el('g', opacity !== 1 ? { opacity } : {}, parent);
    const all = close ? [...pts, pts[0]] : pts;
    for (let pass = 0; pass < 2; pass++) {
      const jp = Sketch._jitterPts(all, seed, pass, roughness);
      const d = 'M' + jp.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
      el('path', { d: d + (close ? ' Z' : ''), fill: pass === 0 ? fill : 'none',
                   stroke, 'stroke-width': width, 'stroke-linecap': 'round',
                   'stroke-linejoin': 'round', opacity: pass === 0 ? 1 : 0.55,
                   ...(dash ? { 'stroke-dasharray': dash } : {}) }, g);
    }
    return g;
  },
  ellipsePts(cx, cy, rx, ry, n = 18, wobble = 0, seed = 1) {
    const r = makeRng((seed * 31 + 7) | 0), pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 2 * Math.PI, w = 1 + wobble * (r.uniform() * 2 - 1);
      pts.push([cx + rx * w * Math.cos(a), cy + ry * w * Math.sin(a)]);
    }
    return pts;
  },
  circle(parent, cx, cy, radius, opts = {}) {
    return Sketch.path(parent, Sketch.ellipsePts(cx, cy, radius, radius, 16, 0, opts.seed || 1),
                       { close: true, ...opts });
  },
  /** Organic blob — a circle with low-frequency radial noise (the resource pool). */
  blob(parent, cx, cy, radius, opts = {}) {
    return Sketch.path(parent, Sketch.ellipsePts(cx, cy, radius, radius, 18, 0.09, opts.seed || 1),
                       { close: true, ...opts });
  },
  square(parent, cx, cy, size, opts = {}) {
    const h = size / 2;
    return Sketch.path(parent, [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]],
                       { close: true, ...opts });
  },
  /** Diamond — an institution / rule node in the system graph. */
  diamond(parent, cx, cy, size, opts = {}) {
    const h = size / 2;
    return Sketch.path(parent, [[cx, cy - h], [cx + h, cy], [cx, cy + h], [cx - h, cy]],
                       { close: true, ...opts });
  },
  line(parent, x1, y1, x2, y2, opts = {}) {
    return Sketch.path(parent, [[x1, y1], [x2, y2]], opts);
  },
  /** Plain (non-rough) structural line — zones/axes per the site grammar. */
  plainLine(parent, x1, y1, x2, y2, stroke = '#c3ccd6', width = 1, dash = '') {
    return el('line', { x1, y1, x2, y2, stroke, 'stroke-width': width,
                        ...(dash ? { 'stroke-dasharray': dash } : {}) }, parent);
  },
  /** Dashed sketch edge with an arrowhead, trimmed clear of both nodes —
      the mockups' message-carrying edge. */
  edge(parent, x1, y1, x2, y2, { trim1 = 12, trim2 = 14, stroke = '#9aa2ab', width = 1,
                                 seed = 1, opacity = 1, arrow = true } = {}) {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const ax = x1 + ux * trim1, ay = y1 + uy * trim1;
    const bx = x2 - ux * trim2, by = y2 - uy * trim2;
    Sketch.line(parent, ax, ay, bx, by, { stroke, width, seed, opacity, dash: '4,4', roughness: 0.5 });
    if (arrow) Sketch.arrowHead(parent, bx, by, Math.atan2(uy, ux), stroke, width, opacity);
  },
  arrowHead(parent, x, y, angle, stroke, width = 1, opacity = 1) {
    const back = angle + Math.PI;
    for (const off of [-0.46, 0.46])
      Sketch.plainLine(parent, x, y, x + 7.5 * Math.cos(back + off), y + 7.5 * Math.sin(back + off),
                       stroke, width).setAttribute('opacity', opacity);
  },
  /** A hand-drawn callout: wobbly arrow + handwritten label (the mockups'
      "Regulator system →" annotations). Label sits at the arrow's tail. */
  callout(parent, fromX, fromY, toX, toY, label, { color = '#1e1e1e', anchor = 'start', size = 12.5 } = {}) {
    Sketch.line(parent, fromX, fromY, toX, toY, { stroke: color, width: 1.1, roughness: 1.4, seed: (fromX * 3 + toY) | 0 });
    Sketch.arrowHead(parent, toX, toY, Math.atan2(toY - fromY, toX - fromX), color, 1.1);
    Sketch.text(parent, fromX + (anchor === 'end' ? 4 : -4), fromY - 6, label,
                { size, color, hand: true, anchor: anchor === 'end' ? 'start' : 'end' });
  },
  /** A message packet at fraction f along a→b (the mockups' little squares). */
  packet(parent, x1, y1, x2, y2, f, { size = 7, color = '#1e1e1e', opacity = 1, rot = 8 } = {}) {
    const x = x1 + (x2 - x1) * f, y = y1 + (y2 - y1) * f;
    el('rect', { x: x - size / 2, y: y - size / 2, width: size, height: size, rx: 1.5,
                 fill: color, opacity, transform: `rotate(${rot} ${x} ${y})` }, parent);
  },
  /** Hatched system ellipse (the mockups' "Regulator system" blob): diagonal
      hatch clipped to the ellipse + a rough outline. */
  hatchEllipse(parent, cx, cy, rx, ry, color, seed = 1) {
    const id = `hatch-${++Sketch._uid}`;
    const defs = el('defs', {}, parent);
    el('ellipse', { cx, cy, rx, ry }, el('clipPath', { id }, defs));
    const g = el('g', { 'clip-path': `url(#${id})`, opacity: 0.28 }, parent);
    for (let x = cx - rx - ry; x < cx + rx + ry; x += 11)
      el('line', { x1: x, y1: cy + ry + 4, x2: x + 2 * ry, y2: cy - ry - 4,
                   stroke: color, 'stroke-width': 1 }, g);
    Sketch.path(parent, Sketch.ellipsePts(cx, cy, rx, ry, 26, 0.02, seed),
                { close: true, stroke: color, width: 1.5, roughness: 0.9, seed });
  },
  text(parent, x, y, content, { size = 11, color = '#1e1e1e', opacity = 1, hand = false,
                                anchor = 'start', spacing = 0 } = {}) {
    const t = el('text', { x, y, 'font-size': size, fill: color, opacity, 'text-anchor': anchor,
                           ...(spacing ? { 'letter-spacing': spacing } : {}) }, parent);
    t.style.fontFamily = hand ? 'var(--hand)' : 'var(--sans)';
    t.textContent = content;
    return t;
  },
};

const INK = '#1e1e1e', NAVY = '#003b7e', MECH_BLUE = '#1c7ed6', MECH_ORANGE = '#f08c00',
      ALERT_RED = '#e03131', ZONE_TINT = '#edf3f9', LABEL = '#8a94a0', EDGE = '#9aa2ab';

/* =============================================================================
   SECTION 4 — SHELL                (port: sim/shell/{registry,driver,playback,
   views,story,legend,controls,charts,badges}.ts as a React island)
   Generic: renders any registered game from its schema + trajectory, including
   the view switcher, the story walkthrough, and the reading key. The contract
   check for this section: it contains no game-specific key.
============================================================================= */
const Playground = (() => {
  const GAMES = {};   // id -> {schema, engine, scenes} — one line per game
  let currentEpoch = 0;   // remount guard: stale rAF loops and async runs stop themselves

  function register(mod) { GAMES[mod.schema.id] = mod; }

  /** The scenario switcher + game host. `scenarios` lists all five lab
      scenarios; entries without an id are in-design placeholders (no backend
      environment exists yet — same honesty rule as the site's status chips). */
  function app(root, scenarios) {
    const bar = document.createElement('div'); bar.className = 'scenario-bar';
    const host = document.createElement('div');
    root.append(bar, host);
    let activeId = null;
    const chips = scenarios.map((s) => {
      const b = document.createElement('button');
      b.className = 'chip';
      const dot = document.createElement('span');
      dot.className = 'dot'; dot.dataset.live = s.id ? (s.sketch ? 'sketch' : '1') : '0';
      b.append(dot, document.createTextNode(s.label));
      if (!s.id) { b.disabled = true; b.title = 'in design — no backend environment yet'; }
      else {
        if (s.sketch) b.title = 'web-first design sketch — dynamics illustrative, backend environment not built yet';
        b.addEventListener('click', () => { if (activeId !== s.id) pick(s.id, true); });
      }
      bar.appendChild(b);
      return { s, b };
    });
    function pick(id, updateHash) {
      activeId = id;
      chips.forEach(({ s, b }) => { b.dataset.on = s.id === id ? '1' : '0'; });
      if (updateHash) try { history.replaceState(null, '', `#${id}`); } catch { /* sandboxed */ }
      mount(host, id);
    }
    // deep link: #economy etc. selects a scenario (the site links per scenario)
    const fromHash = scenarios.find((s) => s.id && `#${s.id}` === location.hash);
    pick((fromHash || scenarios.find((s) => s.id)).id, false);
  }

  // the reading key's glyph vocabulary — shared visual grammar, shell-owned
  const GLYPHS = {
    circle: (svg) => Sketch.circle(svg, 11, 8, 6, { seed: 4, fill: '#ffffff', width: 1.2 }),
    square: (svg) => {
      el('rect', { x: 6.5, y: 3.5, width: 9, height: 9, fill: INK, opacity: 0.5 }, svg);
      Sketch.square(svg, 11, 8, 12, { seed: 5, width: 1.2 });
    },
    packet: (svg) => el('rect', { x: 7, y: 4, width: 8, height: 8, rx: 1.5, fill: INK, transform: 'rotate(8 11 8)' }, svg),
    packetRed: (svg) => el('rect', { x: 7, y: 4, width: 8, height: 8, rx: 1.5, fill: ALERT_RED, transform: 'rotate(8 11 8)' }, svg),
    packetBlue: (svg) => el('rect', { x: 7, y: 4, width: 8, height: 8, rx: 1.5, fill: MECH_BLUE, transform: 'rotate(8 11 8)' }, svg),
    packetOrange: (svg) => el('rect', { x: 7, y: 4, width: 8, height: 8, rx: 1.5, fill: MECH_ORANGE, transform: 'rotate(8 11 8)' }, svg),
    blob: (svg) => Sketch.blob(svg, 11, 8, 6.5, { seed: 17, fill: '#dbe7f2', width: 1.2 }),
    ringBlue: (svg) => Sketch.square(svg, 11, 8, 12, { seed: 6, stroke: MECH_BLUE, width: 1.4 }),
    ringOrange: (svg) => Sketch.square(svg, 11, 8, 12, { seed: 6, stroke: MECH_ORANGE, width: 1.4 }),
    diamondBlue: (svg) => Sketch.diamond(svg, 11, 8, 13, { seed: 7, stroke: MECH_BLUE, width: 1.4 }),
    diamondOrange: (svg) => Sketch.diamond(svg, 11, 8, 13, { seed: 7, stroke: MECH_ORANGE, width: 1.4 }),
    circleRed: (svg) => Sketch.circle(svg, 11, 8, 6, { seed: 4, fill: ALERT_RED, width: 1.2, opacity: 0.85 }),
    squareRed: (svg) => {
      el('rect', { x: 6.5, y: 3.5, width: 9, height: 9, fill: ALERT_RED }, svg);
      Sketch.square(svg, 11, 8, 12, { seed: 5, width: 1.2 });
    },
  };

  async function mount(root, gameId) {
    const epoch = ++currentEpoch;   // a newer mount invalidates this one
    const { schema, engine, scenes } = GAMES[gameId];
    root.style.setProperty('--mech-blue', schema.mechColor || '#1c7ed6');   // mechanism accent per game
    document.querySelector('[data-slot="title"]').textContent = schema.title;
    document.querySelector('[data-slot="blurb"]').textContent = schema.blurb;
    document.querySelector('[data-slot="colophon"]').textContent = schema.colophon;

    // --- state -----------------------------------------------------------
    const params = {};
    for (const p of schema.params) params[p.key] = p.default;
    for (const m of schema.mechanisms) params[m.key] = false;
    for (const [k, v] of Object.entries(schema.fixed)) params[k] = v;
    const presetByKey = (k) => schema.presets.find((p) => p.key === k);
    applyPreset(presetByKey(schema.intro?.presetKey) || schema.presets[0]);
    let seed = schema.intro?.seed ?? 7;
    let traj = null, sceneLayer = null, viewKey = schema.views[0].key;

    function applyPreset(preset) {
      for (const m of schema.mechanisms) params[m.key] = preset.mechanisms.includes(m.key);
      Object.assign(params, preset.overrides || {});
    }

    // --- DOM skeleton ----------------------------------------------------
    root.innerHTML = `
      <div class="lab-grid">
        <div class="stage">
          <div class="story hidden">
            <div class="story-dots"></div>
            <h3 class="story-title"></h3>
            <p class="story-body"></p>
            <div class="story-nav">
              <button class="s-skip chip">skip the story</button>
              <button class="s-next chip">next →</button>
            </div>
          </div>
          <div class="viewbar"><span class="v-label">view</span></div>
          <div class="scene-wrap"></div>
          <div class="legend"></div>
          <div class="chart-wrap"></div>
          <div class="transport">
            <button class="t-play" aria-label="play or pause">▶ play</button>
            <span class="speed"></span>
            <input class="scrub" type="range" min="0" value="0" step="1" aria-label="scrub through the run">
            <span class="step-readout"></span>
          </div>
        </div>
        <aside class="rail">
          <section><h2>${schema.presetHeading || 'Defenses (presets)'}</h2><div class="presets"></div>
            <div class="mechs" style="margin-top:10px"></div><p class="mech-note"></p></section>
          <section><h2>Initialization</h2><div class="params"></div>
            <div class="seed-row"><label>seed <input type="number" class="seed-in"></label>
            <button class="t-reroll">↻ reroll</button></div></section>
          <section><h2>Readouts · this run</h2><div class="badges"></div>
            <p class="anchors"></p></section>
        </aside>
      </div>`;
    const q = (sel) => root.querySelector(sel);
    const sceneWrap = q('.scene-wrap'), chartWrap = q('.chart-wrap');
    q('.anchors').textContent = schema.anchorsNote;

    // reading key (persistent, from schema.legend)
    for (const item of schema.legend || []) {
      const span = document.createElement('span'); span.className = 'lg-item';
      const svg = el('svg', { width: 22, height: 16, viewBox: '0 0 22 16', 'aria-hidden': 'true' });
      GLYPHS[item.glyph]?.(svg);
      span.appendChild(svg);
      span.appendChild(document.createTextNode(item.label));
      q('.legend').appendChild(span);
    }

    // view switcher (generic over schema.views)
    const viewBtns = schema.views.map((v) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = v.label;
      b.addEventListener('click', () => { viewKey = v.key; syncViews(); rebuildScene(); drawFrame(true); });
      q('.viewbar').appendChild(b);
      return { v, b };
    });
    const syncViews = () => viewBtns.forEach(({ v, b }) => { b.dataset.on = v.key === viewKey ? '1' : '0'; });
    if (schema.story?.length) {
      const rb = document.createElement('button');
      rb.className = 'chip s-replay'; rb.textContent = '↺ story';
      rb.addEventListener('click', () => enterStory());
      q('.viewbar').appendChild(rb);
    }

    // presets
    const presetBtns = schema.presets.map((preset) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = preset.label;
      b.addEventListener('click', () => { applyPreset(preset); syncControls(); recompute(); });
      q('.presets').appendChild(b);
      return { preset, b };
    });

    // mechanism toggles ("advanced" row — presets are the primary interaction)
    const mechInputs = schema.mechanisms.map((m) => {
      const row = document.createElement('div'); row.className = 'mech-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = `mech-${m.key}`;
      const lb = document.createElement('label');
      lb.htmlFor = cb.id; lb.textContent = m.label;
      row.append(cb, lb); q('.mechs').appendChild(row);
      cb.addEventListener('change', () => { params[m.key] = cb.checked; syncControls(); recompute(); });
      return { m, cb };
    });

    // param sliders
    const sliderEls = schema.params.map((p) => {
      const wrap = document.createElement('div'); wrap.className = 'param';
      wrap.innerHTML = `<div class="p-head"><label for="p-${p.key}">${p.label}</label>
        <span class="p-val"></span></div>
        <input id="p-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}">`;
      q('.params').appendChild(wrap);
      const input = wrap.querySelector('input'), val = wrap.querySelector('.p-val');
      input.addEventListener('input', () => { params[p.key] = Number(input.value); val.textContent = input.value; recompute(); });
      return { p, input, val };
    });

    function syncControls() {
      for (const { preset, b } of presetBtns) {
        const mechOk = schema.mechanisms.every((m) => params[m.key] === preset.mechanisms.includes(m.key));
        const parOk = Object.entries(preset.overrides || {}).every(([k, v]) => Math.abs(params[k] - v) < 1e-9);
        b.dataset.on = mechOk && parOk ? '1' : '0';
      }
      for (const { m, cb } of mechInputs) cb.checked = params[m.key];
      for (const { p, input, val } of sliderEls) { input.value = params[p.key]; val.textContent = String(params[p.key]); }
      const note = schema.mechanismNote(params);
      q('.mech-note').textContent = note || '';
      q('.mech-note').dataset.show = note ? '1' : '0';
    }

    // seed
    const seedIn = q('.seed-in');
    seedIn.value = seed;
    seedIn.addEventListener('change', () => { seed = (Number(seedIn.value) | 0); recompute(); });
    q('.t-reroll').addEventListener('click', () => {
      seed = Math.floor(Math.random() * 1e6); seedIn.value = seed; recompute();
    });

    // --- playback clock --------------------------------------------------
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let playing = false, tFloat = 0, stepsPerSec = 20, lastTick = 0, lastDraw = 0, drawnT = -1;
    let playUntil = null;   // story steps auto-play to a target tick, then hold
    const playBtn = q('.t-play'), scrub = q('.scrub'), stepOut = q('.step-readout');

    for (const [label, sps] of [['0.5×', 10], ['1×', 20], ['2×', 40], ['4×', 80]]) {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = label; b.dataset.sps = sps;
      b.addEventListener('click', () => { stepsPerSec = sps; syncSpeed(); });
      q('.speed').appendChild(b);
    }
    const syncSpeed = () => q('.speed').querySelectorAll('.chip').forEach(
      (b) => { b.dataset.on = Number(b.dataset.sps) === stepsPerSec ? '1' : '0'; });
    syncSpeed();

    function setPlaying(on) {
      playing = on; lastTick = performance.now();
      playBtn.textContent = on ? '❚❚ pause' : '▶ play';
    }
    playBtn.addEventListener('click', () => {
      if (!playing && traj && Math.floor(tFloat) >= traj.meta.T - 1) tFloat = 0;  // replay from end
      setPlaying(!playing);
    });
    scrub.addEventListener('input', () => { tFloat = Number(scrub.value); drawFrame(true); });

    function tick(now) {
      if (epoch !== currentEpoch) return;   // another game took over — stop this loop
      requestAnimationFrame(tick);
      if (!traj) return;
      if (playing) {
        tFloat = Math.min(tFloat + ((now - lastTick) / 1000) * stepsPerSec, traj.meta.T - 1);
        if (playUntil != null && tFloat >= playUntil) { tFloat = playUntil; playUntil = null; setPlaying(false); }
        else if (tFloat >= traj.meta.T - 1) setPlaying(false);
      }
      lastTick = now;
      // while playing, redraw continuously (packets slide within a tick);
      // paused, only when the integer step changes (scrub calls drawFrame itself)
      const due = now - lastDraw > 40;    // ~25 fps cap
      if (due && (playing || Math.floor(tFloat) !== drawnT)) drawFrame(true, now);
    }

    function drawFrame(force, now = performance.now()) {
      if (!traj) return;
      const t = clip(Math.floor(tFloat), 0, traj.meta.T - 1);
      const frac = clip(tFloat - t, 0, 1);
      drawnT = t; lastDraw = now;
      scrub.value = t;
      stepOut.textContent = `t = ${t} / ${traj.meta.T}`;
      dynScene.replaceChildren(); scenes[viewKey].drawFrame(dynScene, sceneLayer, traj, t, frac);
      dynChart.replaceChildren(); drawPlayheads(dynChart, t);
    }

    // --- scene host ------------------------------------------------------
    let dynScene = null, annScene = null;   // annScene: story annotations overlay
    function rebuildScene() {
      sceneWrap.replaceChildren();
      const svg = el('svg', { viewBox: `0 0 880 400`, role: 'img', 'aria-label': schema.sceneAria }, sceneWrap);
      const statG = el('g', {}, svg);
      sceneLayer = scenes[viewKey].layout(statG, traj);   // static layer: per run / view
      if (schema.sketch)   // the site grammar: in-design is said in words, never dashes
        Sketch.text(statG, 872, 12, 'DESIGN SKETCH — illustrative dynamics, no cilib environment yet',
                    { size: 9.5, color: LABEL, anchor: 'end', spacing: 0.8 });
      dynScene = el('g', {}, svg);
      annScene = el('g', {}, svg);
      const tip = document.createElement('div'); tip.className = 'tip';
      sceneWrap.appendChild(tip);
    }

    // hover inspector: scenes may publish layer.hotspots = [{x, y, r, info(traj, t) -> string[]}]
    sceneWrap.addEventListener('pointermove', (e) => {
      const svg = sceneWrap.querySelector('svg'), tip = sceneWrap.querySelector('.tip');
      if (!svg || !tip || !traj || !sceneLayer?.hotspots) return;
      const rect = svg.getBoundingClientRect();
      const vx = (e.clientX - rect.left) * 880 / rect.width;
      const vy = (e.clientY - rect.top) * 400 / rect.height;
      let best = null, bd = Infinity;
      for (const h of sceneLayer.hotspots) {
        const d = Math.hypot(h.x - vx, h.y - vy);
        if (d < h.r + 8 && d < bd) { bd = d; best = h; }
      }
      if (!best) { tip.style.display = 'none'; return; }
      const lines = best.info(traj, drawnT);
      tip.replaceChildren(...lines.map((ln, i) => {
        const d = document.createElement('div');
        if (i === 0) d.className = 'tip-title';
        d.textContent = ln;
        return d;
      }));
      tip.style.display = 'block';
      tip.style.left = `${(best.x / 880) * rect.width + 14}px`;
      tip.style.top = `${(best.y / 400) * rect.height + 12}px`;
    });
    sceneWrap.addEventListener('pointerleave', () => {
      const tip = sceneWrap.querySelector('.tip');
      if (tip) tip.style.display = 'none';
    });

    // --- story walkthrough (generic over schema.story) -------------------
    const storyEls = {
      panel: q('.story'), dots: q('.story-dots'), title: q('.story-title'),
      body: q('.story-body'), next: q('.s-next'), skip: q('.s-skip'),
    };
    let storyIdx = -1, prevSpeed = 20;

    function enterStory() {
      if (!schema.story?.length) return;
      prevSpeed = stepsPerSec;
      storyEls.panel.classList.remove('hidden');
      q('.viewbar').classList.add('hidden');
      q('.transport').classList.add('hidden');
      root.querySelector('.rail').classList.add('dimmed');
      storyEls.dots.replaceChildren();
      schema.story.forEach((_, i) => {
        const d = document.createElement('button');
        d.setAttribute('aria-label', `story step ${i + 1}`);
        d.addEventListener('click', () => showStep(i));
        storyEls.dots.appendChild(d);
      });
      showStep(0);
    }
    async function showStep(i) {
      storyIdx = i;
      const step = schema.story[i];
      storyEls.title.textContent = `${i + 1}. ${step.title}`;
      storyEls.body.textContent = step.body;
      storyEls.next.textContent = i === schema.story.length - 1 ? 'start playing →' : 'next →';
      [...storyEls.dots.children].forEach((d, j) => { d.dataset.on = j === i ? '1' : '0'; });
      if (step.view && step.view !== viewKey) { viewKey = step.view; syncViews(); rebuildScene(); }
      if (step.preset) {   // a story can tour conditions, not just the timeline
        applyPreset(presetByKey(step.preset));
        syncControls();
        await doRecompute();
        if (storyIdx !== i) return;   // user clicked ahead while we recomputed
      }
      playUntil = null;
      tFloat = step.t ?? 0;
      if (step.playTo != null && !reducedMotion) {
        stepsPerSec = step.speed ?? 20; syncSpeed();
        playUntil = step.playTo; setPlaying(true);
      } else {
        if (step.playTo != null) tFloat = step.playTo;   // reduced motion: jump to the end state
        setPlaying(false);
      }
      drawFrame(true);
      annScene.replaceChildren();
      step.annotate?.(annScene, sceneLayer, traj);
    }
    function exitStory() {
      storyIdx = -1; playUntil = null;
      storyEls.panel.classList.add('hidden');
      q('.viewbar').classList.remove('hidden');
      q('.transport').classList.remove('hidden');
      root.querySelector('.rail').classList.remove('dimmed');
      annScene.replaceChildren();
      stepsPerSec = prevSpeed; syncSpeed();
      tFloat = 0;
      setPlaying(!reducedMotion);
      drawFrame(true);
    }
    storyEls.next.addEventListener('click', () => {
      storyIdx + 1 < schema.story.length ? showStep(storyIdx + 1) : exitStory();
    });
    storyEls.skip.addEventListener('click', exitStory);

    // --- charts (generic: schema.charts over trajectory series) ----------
    let chartGeoms = [], dynChart = null;
    function buildCharts() {
      chartWrap.replaceChildren();
      const W = 880, CH = 118, PAD = { l: 46, r: 14, t: 18, b: 6 };
      const H = schema.charts.length * CH + 12;
      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
        'aria-label': 'time-series charts for the current run' }, chartWrap);
      const stat = el('g', {}, svg);
      chartGeoms = schema.charts.map((c, ci) => {
        const top = ci * CH + PAD.t, bot = top + CH - PAD.t - PAD.b;
        const geom = { c, top, bot, x0: PAD.l, x1: W - PAD.r };
        const lines = c.lines(traj).filter((ln) => ln.ys);
        let yMax = c.yMax ?? Math.max(...lines.map((ln) => Math.max(...ln.ys)), 1e-9) * 1.12;
        geom.x = (t) => geom.x0 + (t / (traj.meta.T - 1)) * (geom.x1 - geom.x0);
        geom.y = (v) => bot - clip(v / yMax, 0, 1) * (bot - top);
        // dashed grid, mockup-style ("Metrics over time"): quiet, structural
        for (let gt = 100; gt < traj.meta.T; gt += 100)
          Sketch.plainLine(stat, geom.x(gt), top, geom.x(gt), bot, '#e4e0d7', 1, '4,5');
        Sketch.plainLine(stat, geom.x0, (top + bot) / 2, geom.x1, (top + bot) / 2, '#e4e0d7', 1, '4,5');
        Sketch.plainLine(stat, geom.x0, bot, geom.x1, bot, '#c9c4ba');       // axes: plain
        Sketch.plainLine(stat, geom.x0, top, geom.x0, bot, '#c9c4ba');
        Sketch.text(stat, geom.x0 - 4, top + 4, String(Math.round(yMax)), { size: 10, color: LABEL, anchor: 'end' });
        Sketch.text(stat, geom.x0 - 4, bot, '0', { size: 10, color: LABEL, anchor: 'end' });
        Sketch.text(stat, geom.x0, top - 6, c.label, { size: 10, color: LABEL, spacing: 1 });
        for (const ln of lines) {
          const step = Math.max(1, Math.floor(traj.meta.T / 140));       // downsample for the sketch
          const pts = [];
          for (let t = 0; t < traj.meta.T; t += step) pts.push([geom.x(t), geom.y(ln.ys[t])]);
          if (ln.dash) Sketch.path(stat, pts, { seed: ci * 11 + 5, stroke: ln.color, width: 1.1, roughness: 0.4, dash: '5,4', opacity: 0.8 });
          else Sketch.path(stat, pts, { seed: ci * 13 + 3, stroke: ln.color, width: 1.5, roughness: 0.5 });
          if (ln.note) Sketch.text(stat, geom.x1 - 4, geom.y(ln.ys[traj.meta.T - 1]) - 5, ln.note,
                                   { size: 11.5, color: ln.color, hand: true, anchor: 'end', opacity: 0.85 });
        }
        return geom;
      });
      Sketch.text(stat, W - PAD.r, H - 2, `0 → ${traj.meta.T} ticks`, { size: 10, color: LABEL, anchor: 'end' });
      dynChart = el('g', {}, svg);
    }
    function drawPlayheads(g, t) {
      for (const geom of chartGeoms) {
        const x = geom.x(t);
        Sketch.plainLine(g, x, geom.top - 2, x, geom.bot, NAVY, 1.2);
        el('path', { d: `M${x - 3.5} ${geom.top - 6} L${x + 3.5} ${geom.top - 6} L${x} ${geom.top - 1} Z`, fill: NAVY }, g);
      }
    }

    // --- badges ----------------------------------------------------------
    function buildBadges() {
      const wrap = q('.badges'); wrap.replaceChildren();
      for (const b of schema.badges) {
        const d = document.createElement('div'); d.className = 'badge';
        d.innerHTML = `<div class="b-label">${b.label}</div>
          <div class="b-value">${b.fmt(traj.meta.scalars[b.key])}</div>`;
        wrap.appendChild(d);
      }
    }

    // --- derived Pipeline view -------------------------------------------
    // Any game whose trajectory carries the v1.1 `system` DAG gets this view
    // appended — one generic renderer, no per-game scene code, no schema entry.
    function ensurePipelineView() {
      if (!traj?.system || viewBtns.some((x) => x.v.key === 'pipeline')) return;
      scenes.pipeline = PipelineScene;
      const v = { key: 'pipeline', label: 'Pipeline' };
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = v.label;
      b.title = "derived from the backend's @transform reads/writes — nobody drew this";
      b.addEventListener('click', () => { viewKey = v.key; syncViews(); rebuildScene(); drawFrame(true); });
      const replay = q('.viewbar .s-replay');
      if (replay) q('.viewbar').insertBefore(b, replay); else q('.viewbar').appendChild(b);
      viewBtns.push({ v, b });
      syncViews();
    }

    // --- recompute: the whole trajectory, on every change ----------------
    async function doRecompute() {
      const t0 = await engine.run({ ...params }, seed);
      if (epoch !== currentEpoch) return;   // user switched game mid-run
      traj = t0;
      ensurePipelineView();
      scrub.max = traj.meta.T - 1;
      rebuildScene();
      buildCharts(); buildBadges(); syncControls();
      tFloat = clip(tFloat, 0, traj.meta.T - 1);
      drawFrame(true);
    }
    let pending = false;
    function recompute() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; doRecompute(); });   // batch slider bursts
    }

    syncViews(); syncControls();
    await doRecompute();
    requestAnimationFrame(tick);
    if (schema.story?.length) enterStory();       // first-run walkthrough owns playback
    else if (!reducedMotion) setPlaying(true);    // reduced-motion: land on t=0, scrubbable
  }

  return { register, mount, app, GAMES };
})();

/* =============================================================================
   SECTION 4b — THE SYSTEM GRAPH               (port: sim/shell/systemScene.ts)
   The universal representation: EVERYTHING is a node in one information-passing
   graph — households, AI systems, resource depots, production, and the
   mechanisms themselves (quota rules, sanction rules, tax authorities) — and
   every within-tick interaction is a message on an edge. This is the ontology
   of the "Langlands program for collective intelligence" claim, and it is
   already latent in the backend: every @transform declares reads/writes, so a
   mechanism's in-edges ARE its reads and its out-edges ARE its writes;
   compile_pipeline's dependency DAG is this same graph read as computation.
   A game expresses itself here declaratively; one renderer draws them all.
   This is also the object a future graph EDITOR edits, and the view any
   spec-defined scenario gets for free before anyone hand-crafts a scene.

   SystemSpec = {
     nodes(traj) -> [{ id, kind: 'human'|'ai'|'stock'|'institution'|'process',
                       color?, label?,                  // institutions: mech color + name
                       present?(traj,t) -> bool,        // e.g. AI before arrival
                       size?(traj,t) -> px,             // stocks/process/ai scale
                       fillOpacity?(traj,t) -> 0..1,    // ai drift shading
                       caption?(traj,t) -> string,      // hand note under the node
                       info?(traj,t) -> string[] }],    // hover inspector
     edges?(traj) -> [{ from, to }],                    // persistent structure (faint)
     flows(traj, t) -> [{ from, to, size, color,        // messages this tick
                          window?: [f0, f1] }],         // sub-tick timing
     captions?(traj) -> [{ x, y, text }],               // group labels
   }
============================================================================= */
function buildSystemScene(spec) {
  const layoutNodes = (traj) => {
    const nodes = spec.nodes(traj);
    const byKind = { human: [], ai: [], stock: [], institution: [], process: [] };
    for (const n of nodes) byKind[n.kind].push(n);
    const H = byKind.human.length;
    byKind.human.forEach((n, i) => {
      const a = (-68 + (136 * i) / Math.max(H - 1, 1)) * (Math.PI / 180);
      n.x = 170 + 128 * Math.cos(a); n.y = 205 + 148 * Math.sin(a);
    });
    const A = byKind.ai.length;   // many AI nodes: facing arc; few: a column
    byKind.ai.forEach((n, j) => {
      if (A > 8) {
        const a = (-68 + (136 * j) / Math.max(A - 1, 1)) * (Math.PI / 180);
        n.x = 590 - 128 * Math.cos(a); n.y = 205 + 148 * Math.sin(a);
      } else { n.x = 720; n.y = A > 1 ? 62 + j * (276 / (A - 1)) : 205; }
    });
    byKind.stock.forEach((n, k) => { n.x = 785; n.y = 205 + k * 95; });
    const I = byKind.institution.length;
    byKind.institution.forEach((n, k) => { n.x = I > 1 ? 330 + k * (240 / (I - 1)) : 450; n.y = 52; });
    byKind.process.forEach((n) => { n.x = 450; n.y = 205; });
    return nodes;
  };

  const drawNode = (g, n, traj, t, idx) => {
    if (n.present && !n.present(traj, t)) {   // not here yet: a dashed ghost
      Sketch.square(g, n.x, n.y, 12, { seed: 900 + idx, stroke: LABEL, width: 1, roughness: 0.5, dash: '3,3' });
      return;
    }
    const size = n.size ? n.size(traj, t) : undefined;
    if (n.kind === 'human') Sketch.circle(g, n.x, n.y, 7.5, { seed: 900 + idx, fill: '#ffffff', width: 1.3 });
    else if (n.kind === 'ai') {
      const s = size ?? 14;
      const op = n.fillOpacity ? n.fillOpacity(traj, t) : 0.82;
      el('rect', { x: n.x - (s - 4) / 2, y: n.y - (s - 4) / 2, width: s - 4, height: s - 4, fill: INK, opacity: op.toFixed(2) }, g);
      Sketch.square(g, n.x, n.y, s, { seed: 900 + idx, width: 1.3 });
    } else if (n.kind === 'stock') {
      Sketch.blob(g, n.x, n.y, size ?? 40, { seed: 17, fill: '#dbe7f2', stroke: INK, width: 1.5 });
    } else if (n.kind === 'process') {
      Sketch.square(g, n.x, n.y, size ?? 34, { seed: 33, fill: '#f2ede2', width: 1.6 });
    } else {   // institution: a rule is a node too — that is the whole point
      Sketch.diamond(g, n.x, n.y, 24, { seed: 900 + idx, stroke: n.color || INK, width: 1.6, fill: '#ffffff' });
      if (n.label) Sketch.text(g, n.x, n.y - 18, n.label, { size: 11, color: n.color || INK, hand: true, anchor: 'middle' });
    }
    // stock size is a radius; everything else's is a width
    const capOff = n.kind === 'stock' ? (size ?? 40) + 16 : (size ?? 24) / 2 + 16;
    if (n.caption) Sketch.text(g, n.x, n.y + capOff, n.caption(traj, t),
                               { size: 11.5, color: NAVY, hand: true, anchor: 'middle' });
  };

  return {
    layout(g, traj) {
      const nodes = layoutNodes(traj);
      const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
      (spec.edges?.(traj) || []).forEach((e, k) => {
        const a = byId[e.from], b = byId[e.to];
        if (a && b) Sketch.edge(g, a.x, a.y, b.x, b.y, { seed: 300 + k, opacity: 0.32, arrow: false, trim1: 14, trim2: 18 });
      });
      for (const c of spec.captions?.(traj) || [])
        Sketch.text(g, c.x, c.y, c.text, { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
      const layer = { nodes, byId };
      layer.hotspots = nodes.filter((n) => n.info).map((n) => ({
        x: n.x, y: n.y, r: Math.max(12, n.kind === 'stock' ? 52 : 12),
        info: (tr, t) => n.info(tr, t),
      }));
      return layer;
    },
    drawFrame(g, layer, traj, t, frac) {
      layer.nodes.forEach((n, idx) => drawNode(g, n, traj, t, idx));
      for (const f of spec.flows(traj, t)) {
        const a = layer.byId[f.from], b = layer.byId[f.to];
        if (!a || !b) continue;
        const [w0, w1] = f.window || [0, 1];
        if (frac < w0 || frac >= w1) continue;
        Sketch.packet(g, a.x, a.y, b.x, b.y, (frac - w0) / (w1 - w0),
                      { size: f.size, color: f.color, opacity: 0.9, rot: 7 + (a.x + b.y) % 25 });
      }
    },
  };
}

/** Mirror the backend's additive mechanism attachment: drop the transforms
    whose toggle is off (with their edges), stamp the game's mechanism color on
    the ones that stay. Pure — the fixture is never mutated. A side effect the
    ontology predicts: with quota_vote off, `vote` loses its only edge and the
    renderer honestly shelves it as unused. */
function filterSystem(system, params, toggles) {
  const dropped = new Set(); const color = {};
  for (const tg of toggles) for (const n of system.nodes) {
    if (n.kind !== 'transform' || !n.id.includes(tg.match)) continue;
    if (params[tg.param]) color[n.id] = tg.color; else dropped.add(n.id);
  }
  return {
    nodes: system.nodes.filter((n) => !dropped.has(n.id))
                       .map((n) => (color[n.id] ? { ...n, color: color[n.id] } : n)),
    edges: system.edges.filter((e) => !dropped.has(e.from) && !dropped.has(e.to)),
  };
}

/** fieldId -> {readBy, writtenBy} over the graph's transforms. The consumer's
    classification rule from the contract: static input = read, never written;
    orphan = no edges at all (policy-boundary fields like principal_pref). */
function systemRoles(system) {
  const roles = {};
  for (const n of system.nodes) if (n.kind === 'field') roles[n.id] = { readBy: 0, writtenBy: 0 };
  for (const n of system.nodes) if (n.kind === 'transform') {
    for (const r of n.reads) if (roles[r]) roles[r].readBy += 1;
    for (const w of n.writes) if (roles[w]) roles[w].writtenBy += 1;
  }
  return roles;
}
/* @core-end */

/* One renderer, every game. Transforms sit on a horizontal spine in the exact
   order compile_pipeline runs them; each field is placed once, at the
   x-centroid of the transforms that touch it — read-dominant fields in a row
   above (reads flow down into the diamonds), write-dominant below (writes flow
   out). Deterministic arithmetic, no force layout: same DAG, same drawing. */
const PipelineScene = (() => {
  const X0 = 150, X1 = 820, Y_A = 92, Y_SP = 200, Y_B = 312;
  const shortId = (id) => { const m = /^scheduled\((\w+)/.exec(id); return m ? m[1] : id; };
  const schedOf = (id) => { const m = /^scheduled\(\w+,\s*(.+)\)$/.exec(id); return m ? m[1] : null; };
  const listLine = (name, ids) =>
    `${name}: ${ids.slice(0, 3).join(', ')}${ids.length > 3 ? ` +${ids.length - 3} more` : ''}`;

  const glyph = (g, n, x, y, dim, idx) => {
    const gg = el('g', dim ? { opacity: 0.35 } : {}, g);
    const s = dim ? 0.7 : 1;
    if (n.kind === 'transform')
      Sketch.diamond(gg, x, y, 26 * s, { seed: 700 + idx, stroke: n.color || INK, width: 1.5, fill: '#ffffff' });
    else if (n.family === 'adj_matrices') {
      Sketch.square(gg, x, y, 16 * s, { seed: 700 + idx, width: 1.2, fill: '#ffffff' });
      for (const [dx, dy] of [[-3.5, -3.5], [3.5, -3.5], [-3.5, 3.5], [3.5, 3.5]])
        el('circle', { cx: x + dx * s, cy: y + dy * s, r: 1.6, fill: INK }, gg);
    } else if (n.family === 'global_attrs')
      Sketch.blob(gg, x, y, 8 * s, { seed: 700 + idx, fill: '#dbe7f2', width: 1.3 });
    else
      Sketch.circle(gg, x, y, 9 * s, { seed: 700 + idx, fill: '#ffffff', width: 1.3 });
  };

  return {
    layout(g, traj) {
      const sys = traj.system;
      const fields = sys.nodes.filter((n) => n.kind === 'field');
      const transforms = sys.nodes.filter((n) => n.kind === 'transform');
      const kindOf = Object.fromEntries(sys.nodes.map((n) => [n.id, n.kind]));
      const bk = new Set(fields.filter((n) => n.bookkeeping).map((n) => n.id));
      const roles = systemRoles(sys);

      const T = transforms.length;
      const xT = (i) => (T > 1 ? X0 + (i * (X1 - X0)) / (T - 1) : (X0 + X1) / 2);
      // a transform that touches only bookkeeping is bookkeeping too (step_counter)
      const dimmedT = new Set(transforms.filter((tr) =>
        tr.reads.every((r) => bk.has(r)) && tr.writes.every((w) => bk.has(w))).map((tr) => tr.id));

      // --- field placement: centroid + read/write-bias row ---------------
      const touch = {};
      transforms.forEach((tr, i) => {
        for (const r of tr.reads) (touch[r] ??= { r: [], w: [] }).r.push(i);
        for (const w of tr.writes) (touch[w] ??= { r: [], w: [] }).w.push(i);
      });
      const pos = {};
      transforms.forEach((tr, i) => { pos[tr.id] = { x: xT(i), y: Y_SP, r: 13 }; });

      const rows = { A: [], B: [] }, orphans = [];
      fields.forEach((f, si) => {
        if (bk.has(f.id)) return;                       // pinned corner, below
        const t = touch[f.id];
        if (!t) { orphans.push(f); return; }
        const idxs = [...new Set([...t.r, ...t.w])];
        const xRaw = idxs.reduce((p, i) => p + xT(i), 0) / idxs.length;
        const bias = t.w.length - t.r.length;
        rows[bias < 0 ? 'A' : bias > 0 ? 'B' : si % 2 === 0 ? 'A' : 'B'].push({ f, xRaw });
      });
      for (const [row, y] of [['A', Y_A], ['B', Y_B]]) {
        const list = rows[row].sort((a, b) => a.xRaw - b.xRaw);
        let dx = 84;
        if (list.length > 1 && (list.length - 1) * dx > X1 - X0)
          dx = Math.max(40, (X1 - X0) / (list.length - 1));
        let prev = -Infinity;
        for (const it of list) { it.x = Math.max(X0, it.xRaw, prev + dx); prev = it.x; }
        if (prev > X1) for (const it of list) it.x -= prev - X1;
        list.forEach((it, k) => {
          const above = (k % 2 === 0) === (row === 'A');   // A: evens above; B: evens below
          pos[it.f.id] = { x: it.x, y, r: it.f.family === 'adj_matrices' ? 10 : 9,
                           labelY: above ? y - 16 : y + 22 };
        });
      }
      orphans.forEach((f, k) => { pos[f.id] = { x: 846, y: 40 + 34 * k, r: 9 }; });
      const bkFields = fields.filter((n) => bk.has(n.id));
      bkFields.forEach((f, k) => { pos[f.id] = { x: 40, y: 28 + 26 * k, r: 7 }; });

      // --- static drawing ------------------------------------------------
      Sketch.plainLine(g, X0 - 24, Y_SP, X1 + 24, Y_SP, '#e4e0d7', 1, '4,5');
      Sketch.text(g, 485, 22, 'derived from @transform reads / writes — nobody drew this graph',
                  { size: 9.5, color: LABEL, hand: true, anchor: 'middle' });

      // edges (bookkeeping stubs handled separately; bows for read+write pairs)
      const bowPairs = new Set();
      for (const tr of transforms)
        for (const r of tr.reads)
          if (tr.writes.includes(r) && !bk.has(r)) bowPairs.add(`${r}|${tr.id}`);

      const animEdges = [];
      const drawEdge = (a, b, bowOff, seed) => {
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const ax = a.x + ux * (a.r + 4), ay = a.y + uy * (a.r + 4);
        const bx = b.x - ux * (b.r + 6), by = b.y - uy * (b.r + 6);
        if (!bowOff) {
          Sketch.line(g, ax, ay, bx, by, { stroke: EDGE, width: 1, seed, opacity: 0.55, dash: '4,4', roughness: 0.5 });
          Sketch.arrowHead(g, bx, by, Math.atan2(uy, ux), EDGE, 1, 0.55);
          return (f) => ({ x: ax + (bx - ax) * f, y: ay + (by - ay) * f });
        }
        const mx = (ax + bx) / 2 - uy * bowOff, my = (ay + by) / 2 + ux * bowOff;
        Sketch.path(g, [[ax, ay], [mx, my], [bx, by]],
                    { stroke: EDGE, width: 1, seed, opacity: 0.55, dash: '4,4', roughness: 0.5 });
        Sketch.arrowHead(g, bx, by, Math.atan2(by - my, bx - mx), EDGE, 1, 0.55);
        return (f) => (f < 0.5
          ? { x: ax + (mx - ax) * f * 2, y: ay + (my - ay) * f * 2 }
          : { x: mx + (bx - mx) * (f - 0.5) * 2, y: my + (by - my) * (f - 0.5) * 2 });
      };
      sys.edges.forEach((e, k) => {
        if (bk.has(e.from) || bk.has(e.to)) return;
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b) return;
        const fieldId = kindOf[e.from] === 'field' ? e.from : e.to;
        const trId = fieldId === e.from ? e.to : e.from;
        // same +7 for both directions: reversing the edge flips its own normal,
        // so read and write bow to opposite sides and form the lens
        const bowOff = bowPairs.has(`${fieldId}|${trId}`) ? 7 : 0;
        const at = drawEdge(a, b, bowOff, 300 + k);
        const trNode = transforms.find((tr) => tr.id === trId);
        animEdges.push({ at, fieldX: pos[fieldId].x, rot: ((k * 37) % 25) - 12,
                         color: trNode?.color || '#6b7684' });
      });
      animEdges.sort((p, q) => p.fieldX - q.fieldX);
      const E = animEdges.length;
      animEdges.forEach((ae, k) => { ae.window = [(0.7 * k) / E, (0.7 * k) / E + 0.3]; });

      // --- glyphs + labels ----------------------------------------------
      const spacing = T > 1 ? (X1 - X0) / (T - 1) : X1 - X0;
      transforms.forEach((tr, i) => {
        const p = pos[tr.id], dim = dimmedT.has(tr.id);
        glyph(g, tr, p.x, p.y, dim, 100 + i);
        const opts = { size: 10, color: dim ? LABEL : tr.color || INK };
        if (spacing >= 150) Sketch.text(g, p.x + 19, p.y + 4, shortId(tr.id), { ...opts, anchor: 'start' });
        else Sketch.text(g, p.x, i % 2 === 0 ? p.y - 24 : p.y + 32, shortId(tr.id), { ...opts, anchor: 'middle' });
      });
      fields.forEach((f, i) => {
        const p = pos[f.id];
        if (bk.has(f.id)) {
          glyph(g, f, p.x, p.y, true, 200 + i);
          Sketch.text(g, p.x + 14, p.y + 3, f.id, { size: 8.5, color: LABEL, opacity: 0.6 });
          // one faint stub toward the spine stands in for "read/written by all"
          const dx = 485 - p.x, dy = Y_SP - p.y, len = Math.hypot(dx, dy);
          Sketch.plainLine(g, p.x + (dx / len) * 12, p.y + (dy / len) * 12,
                           p.x + (dx / len) * 30, p.y + (dy / len) * 30, '#c9cfd6', 1, '3,4')
                .setAttribute('opacity', 0.35);
          return;
        }
        glyph(g, f, p.x, p.y, false, 200 + i);
        if (orphans.includes(f)) {
          Sketch.circle(g, p.x, p.y, 15, { seed: 200 + i, stroke: LABEL, width: 1, dash: '3,3', roughness: 0.4, opacity: 0.5 });
          Sketch.text(g, p.x - 16, p.y + 3, f.id, { size: 9, color: LABEL, anchor: 'end' });
        } else {
          Sketch.text(g, p.x, p.labelY, f.id, { size: 9, color: LABEL, anchor: 'middle' });
        }
      });
      if (bkFields.length)
        Sketch.text(g, 26, 28 + 26 * bkFields.length + 4, 'threads every step',
                    { size: 8.5, color: LABEL, hand: true, opacity: 0.7 });

      // --- on-scene reading key (this view's own, not the shared legend) -
      const key = el('g', {}, g);
      const rowsK = [
        [(x, y) => Sketch.circle(key, x, y, 5, { seed: 41, fill: '#ffffff', width: 1.1 }), 'per-agent field'],
        [(x, y) => Sketch.blob(key, x, y, 5, { seed: 42, fill: '#dbe7f2', width: 1.1 }), 'global field'],
        [(x, y) => { Sketch.square(key, x, y, 10, { seed: 43, width: 1 });
                     for (const [dx, dy] of [[-2.2, -2.2], [2.2, -2.2], [-2.2, 2.2], [2.2, 2.2]])
                       el('circle', { cx: x + dx, cy: y + dy, r: 1, fill: INK }, key); }, 'adjacency'],
        [(x, y) => Sketch.diamond(key, x, y, 11, { seed: 44, width: 1.1 }), 'transform — one step of every tick'],
        [null, 'faded = rng / step bookkeeping'],
      ];
      rowsK.forEach(([draw, label], k) => {
        const y = 336 + k * 14;
        if (draw) draw(30, y);
        Sketch.text(key, 44, y + 3, label, { size: 8.5, color: LABEL, opacity: draw ? 1 : 0.7 });
      });

      // --- hover inspector ----------------------------------------------
      const roleLine = (f) => {
        if (bk.has(f.id)) return 'bookkeeping — threads every step';
        const r = roles[f.id] || { readBy: 0, writtenBy: 0 };
        if (r.readBy === 0 && r.writtenBy === 0) return 'outside the declared pipeline (policy boundary or unused)';
        if (r.writtenBy === 0) return `static input — read by ${r.readBy}, never written`;
        if (r.readBy === 0) return `sink — written by ${r.writtenBy}, read by nobody`;
        return `read by ${r.readBy} · written by ${r.writtenBy}`;
      };
      const hotspots = [];
      for (const f of fields)
        hotspots.push({ x: pos[f.id].x, y: pos[f.id].y, r: 12,
                        info: () => [f.id, `${f.family} · shape (${f.shape.join('×') || 'scalar'})`, roleLine(f)] });
      for (const tr of transforms) {
        const lines = [shortId(tr.id),
                       dimmedT.has(tr.id) ? 'bookkeeping step' : tr.color ? 'mechanism — attached to this run' : 'substrate step',
                       listLine('reads', tr.reads), listLine('writes', tr.writes)];
        const sched = schedOf(tr.id);
        if (sched) lines.splice(2, 0, `schedule: ${sched}`);
        hotspots.push({ x: pos[tr.id].x, y: pos[tr.id].y, r: 15, info: () => lines });
      }
      return { animEdges, hotspots };
    },

    drawFrame(g, layer, traj, t, frac) {
      for (const ae of layer.animEdges) {
        const [w0, w1] = ae.window;
        if (frac < w0 || frac >= w1) continue;
        const p = ae.at((frac - w0) / (w1 - w0));
        el('rect', { x: p.x - 2.5, y: p.y - 2.5, width: 5, height: 5, rx: 1,
                     fill: ae.color, opacity: 0.85, transform: `rotate(${ae.rot} ${p.x} ${p.y})` }, g);
      }
    },
  };
})();

/* =============================================================================
   SECTION 5 — GAME MODULE: governed_commons     (port: sim/games/commons.ts)
   Exact port of cilib environments/governed_commons/{config,dynamics}.py +
   agents/delegate.py + mechanisms/democracy.py + the benchmark's conditions
   (experiments/benchmark/scenarios.py). NOT lab/paradigms/polycentric (an
   unrelated older commons). Program order per tick: action → harvest → regrow
   → mechanisms → counter; a voted quota takes effect one tick later.
============================================================================= */
/* @core-begin */
const COMMONS_DEFAULTS = {
  nHouseholds: 20, T: 500,
  KCap: 500, growthRate: 0.35, initResource: 350,
  prefCenter: 1.5, prefSpread: 0.5, prefFloor: 0.1,
  alignmentMean: 0.4, alignmentStd: 0.15, greedyTarget: 8.0, actionNoise: 0.3,
  defectProb: 0.15,
  quotaVote: false, voteCadence: 5,
  sanction: false, sanctionStrength: 1.5, confiscateRate: 0.5,
};

/* The intro's "slow village": delegates only slightly drifted, so demand sits
   just above regrowth — a watchable ~200-tick tragedy instead of the paper
   baseline's 4-tick cliff (demand ≈108/tick vs peak regrowth 43.75). Found by
   grid search; seed 14 pairs it with visually contrasting delegates. The
   paper's parameters stay one preset away. */
const COMMONS_VILLAGE = { growthRate: 0.35, alignmentMean: 0.64, greedyTarget: 3.5, defectProb: 0.1 };
const COMMONS_VILLAGE_SEED = 14;
const COMMONS_PAPER = { growthRate: 0.35, alignmentMean: 0.4, greedyTarget: 8, defectProb: 0.15 };

/** One rollout. prefShift mirrors metrics.py::shift_preferences — added to BOTH
    principal_pref and vote, no clamping (the vote channel is the defense's point). */
function runCommonsOnce(P, seed, prefShift = 0) {
  const N = P.nHouseholds, T = P.T, rng = makeRng(seed);
  // init (state.py): draws happen unshifted so paired rollouts share the RNG stream
  const pref = new Float64Array(N), align = new Float64Array(N), vote = new Float64Array(N);
  for (let i = 0; i < N; i++) pref[i] = Math.max(P.prefFloor, P.prefCenter + P.prefSpread * rng.normal()) + prefShift;
  for (let i = 0; i < N; i++) align[i] = clip(P.alignmentMean + P.alignmentStd * rng.normal(), 0, 1);
  vote.set(pref);
  let R = P.initResource, quota = P.KCap;   // policy_target inits non-binding
  const cumHarvest = new Float64Array(N);

  const S = {   // recorded series — the Trajectory's global/node fields
    resource: new Float64Array(T), quota: new Float64Array(T),
    meanHarvest: new Float64Array(T), compliance: new Float64Array(T),
    harvest: new Float64Array(T * N), action: new Float64Array(T * N),
    sanction: new Float64Array(T * N),
  };
  let fidelitySum = 0;

  for (let t = 0; t < T; t++) {
    // delegate policy (agents/delegate.py): the game's closing policy
    for (let i = 0; i < N; i++) {
      S.action[t * N + i] = Math.max(0,
        align[i] * pref[i] + (1 - align[i]) * P.greedyTarget + P.actionNoise * rng.normal());
    }
    // harvest (dynamics.py::make_harvest)
    let total = 0;
    const taken = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const desired = S.action[t * N + i];
      taken[i] = rng.bernoulli(P.defectProb) ? desired : Math.min(desired, quota);
      total += taken[i];
    }
    const scale = total > R ? R / (total + 1e-8) : 1;
    let sum = 0;
    for (let i = 0; i < N; i++) {
      const actual = taken[i] * scale;
      S.harvest[t * N + i] = actual; cumHarvest[i] += actual; sum += actual;
      fidelitySum += 1 - clip(Math.abs(actual - pref[i]) / (pref[i] + 1e-6), 0, 1);
    }
    R = Math.max(R - sum, 0);
    // regrow (logistic)
    R = clip(R + logisticGrowth(R, P.growthRate, P.KCap), 0, P.KCap);
    // mechanisms (post-substrate slot; quota takes effect next tick)
    if (P.quotaVote && fires(t, { cadence: P.voteCadence })) quota = quantile(vote, 0.5);
    if (P.sanction) {
      let overSum = 0;
      for (let i = 0; i < N; i++) {
        const over = Math.max(S.harvest[t * N + i] - quota, 0);
        S.sanction[t * N + i] = P.sanctionStrength * over;
        overSum += over;
      }
      R = clip(R + P.confiscateRate * overSum, 0, P.KCap);
    }
    // trace (post-pipeline state, matching default_trace timing)
    S.resource[t] = R; S.quota[t] = quota;
    S.meanHarvest[t] = sum / N;
    let comp = 0;
    for (let i = 0; i < N; i++) comp += S.harvest[t * N + i] <= quota + 1e-6 ? 1 : 0;
    S.compliance[t] = comp / N;
  }

  return { pref, align, S, R, cumHarvest, fidelity: fidelitySum / (T * N) };
}

/** params+seed -> Trajectory, influence via paired same-seed rollouts
    (counterfactual.py::collective_influence, Δ=−0.5 like the benchmark). */
function runCommons(params, seed) {
  const P = { ...COMMONS_DEFAULTS, ...params };
  const base = runCommonsOnce(P, seed, 0);
  const DELTA = -0.5;
  const shifted = runCommonsOnce(P, seed, DELTA);
  const pch = (r) => r.S.meanHarvest.reduce((p, v) => p + v, 0) / P.T;
  const influence = (pch(shifted) - pch(base)) / DELTA;

  const N = P.nHouseholds;
  return {
    meta: {
      gameId: 'commons', T: P.T, N, seed, params: P,
      scalars: {
        stock_pct: base.R / P.KCap,
        exercised_influence: influence,
        compliance_rate: base.S.compliance.reduce((p, v) => p + v, 0) / P.T,
        harvest_gini: gini(Array.from(base.cumHarvest)),
        influence_fidelity: base.fidelity,
      },
    },
    global: { resource_level: base.S.resource, policy_target: base.S.quota,
              mean_harvest: base.S.meanHarvest, compliance: base.S.compliance },
    node: { harvest: base.S.harvest, delegate_action: base.S.action, sanction: base.S.sanction },
    static: { principal_pref: base.pref, alignment: base.align },
    system: filterSystem(COMMONS_SYSTEM, P, COMMONS_SYS_TOGGLES),   // v1.1 DAG, toggles applied
  };
}
/* @core-end */

/* --- scenes: three visualizations over the same trajectory -------------------
   Shared geometry: households on a left arc, their AI delegates on a facing
   right arc (paired by row), the commons pool at far right. The regulator
   system (when quota voting is on) is the mockups' blue hatched ellipse drawn
   AROUND the households — the demos itself is the regulator — with the quota
   rule as a small blue square node that votes flow into and the enacted quota
   broadcasts out of. Red marks violation (over-quota harvest), blue marks
   governance, ink marks substrate flows. */

function commonsGeometry(traj) {
  const N = traj.meta.N, P = traj.meta.params;
  const homes = [], delegates = [];
  for (let i = 0; i < N; i++) {
    const a = (-68 + (136 * i) / (N - 1)) * (Math.PI / 180);
    homes.push([170 + 128 * Math.cos(a), 205 + 148 * Math.sin(a)]);
    delegates.push([590 - 128 * Math.cos(a), 205 + 148 * Math.sin(a)]);
  }
  return {
    N, P, homes, delegates,
    pool: { cx: 775, cy: 205, maxR: 52 },
    regulator: { cx: 218, cy: 200, rx: 178, ry: 178, node: [92, 96] },
    delegateHub: [520, 205],     // where the quota broadcast lands
  };
}

function commonsHotspots(geo, traj) {
  const hs = [], N = geo.N;
  for (let i = 0; i < N; i++) {
    const [hx, hy] = geo.homes[i], [dx, dy] = geo.delegates[i];
    hs.push({ x: hx, y: hy, r: 9, info: (tr) => [
      `household ${i + 1}`,
      `asks ${tr.static.principal_pref[i].toFixed(2)} per tick`,
    ] });
    hs.push({ x: dx, y: dy, r: 9, info: (tr, t) => {
      const h = tr.node.harvest[t * N + i], s = tr.node.sanction[t * N + i];
      return [
        `delegate ${i + 1}`,
        `alignment ${tr.static.alignment[i].toFixed(2)}`,
        `took ${h.toFixed(2)} this tick`,
        ...(s > 1e-6 ? [`sanctioned −${s.toFixed(2)}`] : []),
      ];
    } });
  }
  hs.push({ x: geo.pool.cx, y: geo.pool.cy, r: geo.pool.maxR, info: (tr, t) => {
    const quota = tr.global.policy_target[t];
    return [
      'the commons',
      `stock R = ${Math.round(tr.global.resource_level[t])} of ${geo.P.KCap}`,
      `quota: ${quota < geo.P.KCap ? quota.toFixed(2) + ' per household' : 'none set'}`,
    ];
  } });
  return hs;
}

function drawPool(g, geo, R, K) {
  const r = 9 + (geo.pool.maxR - 9) * Math.sqrt(R / K);   // perceived AREA tracks stock
  Sketch.blob(g, geo.pool.cx, geo.pool.cy, r, { seed: 17, fill: '#dbe7f2', stroke: INK, width: 1.5 });
  Sketch.text(g, geo.pool.cx, geo.pool.cy + geo.pool.maxR + 24, `R = ${Math.round(R)}`,
              { size: 12, color: NAVY, hand: true, anchor: 'middle' });
  return r;
}

function drawAgents(g, traj, geo, { withPairEdges }) {
  const align = traj.static.alignment;
  for (let i = 0; i < geo.N; i++) {
    const [hx, hy] = geo.homes[i], [dx, dy] = geo.delegates[i];
    if (withPairEdges) Sketch.edge(g, hx, hy, dx, dy, { seed: 130 + i, opacity: 0.55 });
    Sketch.circle(g, hx, hy, 7.5, { seed: 40 + i, fill: '#ffffff', width: 1.3 });
    el('rect', { x: dx - 5.5, y: dy - 5.5, width: 11, height: 11, fill: INK,
                 opacity: (1 - align[i]).toFixed(2) }, g);
    Sketch.square(g, dx, dy, 14, { seed: 90 + i, width: 1.3 });
  }
  Sketch.text(g, 170, 392, 'households', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
  Sketch.text(g, 590, 392, 'AI delegates', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
  Sketch.text(g, geo.pool.cx, 392, 'commons pool', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
}

function drawRegulator(g, traj, geo) {
  if (!traj.meta.params.quotaVote) return;
  const { cx, cy, rx, ry, node } = geo.regulator;
  Sketch.hatchEllipse(g, cx, cy, rx, ry, MECH_BLUE, 23);
  Sketch.square(g, node[0], node[1], 15, { seed: 77, stroke: MECH_BLUE, width: 1.6, fill: '#f3f8fd' });
  Sketch.text(g, 30, 26, 'regulator system', { size: 12.5, color: MECH_BLUE, hand: true });
  Sketch.line(g, 76, 34, node[0] - 4, node[1] - 14, { seed: 78, stroke: MECH_BLUE, width: 1.1, roughness: 0.7 });
  Sketch.arrowHead(g, node[0] - 4, node[1] - 14, Math.atan2(node[1] - 14 - 34, node[0] - 4 - 76), MECH_BLUE, 1.1);
}

function quotaText(g, traj, geo, t) {
  const quota = traj.global.policy_target[t];
  if (!traj.meta.params.quotaVote) return;
  const bound = quota < traj.meta.params.KCap;
  Sketch.text(g, geo.regulator.node[0] + 14, geo.regulator.node[1] + 4,
              bound ? `quota = ${quota.toFixed(2)}` : 'no quota yet',
              { size: 12, color: MECH_BLUE, hand: true });
}

const MessagesScene = {   // mockup panel 1: messages riding the edges
  layout(g, traj) {
    const geo = commonsGeometry(traj);
    drawRegulator(g, traj, geo);
    drawAgents(g, traj, geo, { withPairEdges: true });
    for (let i = 0; i < geo.N; i++) {
      const [dx, dy] = geo.delegates[i];
      Sketch.edge(g, dx, dy, geo.pool.cx, geo.pool.cy, { seed: 160 + i, trim2: geo.pool.maxR + 8, opacity: 0.4, arrow: false });
    }
    geo.hotspots = commonsHotspots(geo, traj);
    return geo;
  },
  drawFrame(g, geo, traj, t, frac) {
    const N = geo.N, P = geo.P;
    drawPool(g, geo, traj.global.resource_level[t], P.KCap);
    quotaText(g, traj, geo, t);
    const quota = traj.global.policy_target[t];
    // harvest packets: pool -> delegate, red when the take violates the quota
    for (let i = 0; i < N; i++) {
      const h = traj.node.harvest[t * N + i];
      if (h < 0.04) continue;
      const [dx, dy] = geo.delegates[i];
      const over = P.quotaVote && h > quota + 1e-6;
      Sketch.packet(g, geo.pool.cx, geo.pool.cy, dx, dy, 1 - 0.85 * frac,
                    { size: 5 + 5 * clip(h / P.greedyTarget, 0, 1),
                      color: over ? ALERT_RED : INK, opacity: 0.9, rot: 8 + i * 7 });
    }
    // governance messages, on vote ticks: votes in (first half), quota out (second)
    if (P.quotaVote && fires(t, { cadence: P.voteCadence })) {
      const [qx, qy] = geo.regulator.node;
      if (frac < 0.55) {
        for (let i = 0; i < N; i += 2) {   // a sample of ballots, not 20 identical squares
          const [hx, hy] = geo.homes[i];
          Sketch.packet(g, hx, hy, qx, qy, frac / 0.55, { size: 5, color: MECH_BLUE, opacity: 0.85, rot: i * 11 });
        }
      } else {
        Sketch.packet(g, qx, qy, geo.delegateHub[0], geo.delegateHub[1], (frac - 0.55) / 0.45,
                      { size: 8, color: MECH_BLUE, rot: 12 });
      }
    }
    // sanctions: blue enforcement ring on the offender
    for (let i = 0; i < N; i++) {
      if (traj.node.sanction[t * N + i] > 1e-6) {
        const [dx, dy] = geo.delegates[i];
        Sketch.square(g, dx, dy, 21, { seed: 500 + i, stroke: MECH_BLUE, width: 1.5, opacity: 0.9 });
      }
    }
  },
};

const ComplianceScene = {   // mockup panel 2 ("trust updates"): edges colored by delta
  layout(g, traj) {
    const geo = commonsGeometry(traj);
    drawRegulator(g, traj, geo);
    drawAgents(g, traj, geo, { withPairEdges: false });
    const against = traj.meta.params.quotaVote ? 'the quota' : 'the ask';
    Sketch.text(g, 852, 26, `blue = within ${against}`, { size: 12, color: MECH_BLUE, hand: true, anchor: 'end' });
    Sketch.text(g, 852, 44, `red = over ${against}`, { size: 12, color: ALERT_RED, hand: true, anchor: 'end' });
    geo.hotspots = commonsHotspots(geo, traj);
    return geo;
  },
  drawFrame(g, geo, traj, t) {
    const N = geo.N, P = geo.P;
    drawPool(g, geo, traj.global.resource_level[t], P.KCap);
    quotaText(g, traj, geo, t);
    const quota = traj.global.policy_target[t];
    for (let i = 0; i < N; i++) {
      const h = traj.node.harvest[t * N + i];
      // with no quota in force, judge against the household's own ask instead —
      // otherwise the collapsing baseline would read as all-blue "fine"
      const limit = P.quotaVote && quota < P.KCap ? quota : traj.static.principal_pref[i];
      const over = h > limit + 1e-6;
      const [hx, hy] = geo.homes[i], [dx, dy] = geo.delegates[i];
      Sketch.edge(g, hx, hy, dx, dy, { seed: 130 + i, stroke: over ? ALERT_RED : MECH_BLUE,
                                       width: 1.2, opacity: 0.75 });
    }
  },
};

const HubScene = {   // mockup panel 3 ("specific views for larger nodes"): pool-centric

                    { size: 5 + 6 * clip(h / P.greedyTarget, 0, 1),
                      color: over ? ALERT_RED : INK, opacity: 0.9, rot: 8 + i * 7 });
      if (traj.node.sanction[t * N + i] > 1e-6)
        Sketch.square(g, x, y, 21, { seed: 500 + i, stroke: MECH_BLUE, width: 1.5, opacity: 0.9 });

/* --- the System view: the commons as one information-passing graph. The pool
   is a resource-depot node; the quota rule and sanction rule are institution
   nodes that appear when their mechanism is on. Flows the curated views never
   showed become visible: votes into the rule, the enacted quota out of it,
   penalties from the sanction node, and confiscated excess flowing back to
   the pool. */
const CommonsSystemScene = buildSystemScene({
  nodes(traj) {
    const P = traj.meta.params, N = traj.meta.N;
    const ns = [];
    for (let i = 0; i < N; i++) ns.push({
      id: `h${i}`, kind: 'human',
      info: (tr) => [`household ${i + 1}`, `asks ${tr.static.principal_pref[i].toFixed(2)} per tick`],
    });
    for (let i = 0; i < N; i++) ns.push({
      id: `d${i}`, kind: 'ai',
      fillOpacity: (tr) => 1 - tr.static.alignment[i],
      info: (tr, t) => [`delegate ${i + 1}`, `alignment ${tr.static.alignment[i].toFixed(2)}`,
                        `took ${tr.node.harvest[t * N + i].toFixed(2)} this tick`],
    });
    ns.push({
      id: 'pool', kind: 'stock',
      size: (tr, t) => 9 + 43 * Math.sqrt(clip(tr.global.resource_level[t] / P.KCap, 0, 1)),
      caption: (tr, t) => `R = ${Math.round(tr.global.resource_level[t])}`,
      info: (tr, t) => ['the commons — a resource-depot node',
                        `stock R = ${Math.round(tr.global.resource_level[t])} of ${P.KCap}`],
    });
    if (P.quotaVote) ns.push({
      id: 'quota', kind: 'institution', color: MECH_BLUE, label: 'quota rule',
      caption: (tr, t) => { const q = tr.global.policy_target[t]; return q < P.KCap ? `= ${q.toFixed(2)}` : 'unset'; },
      info: (tr, t) => ['quota rule — a mechanism is a node too',
                        'reads votes · writes the harvest cap',
                        `current: ${tr.global.policy_target[t] < P.KCap ? tr.global.policy_target[t].toFixed(2) : 'none yet'}`],
    });
    if (P.sanction) ns.push({
      id: 'sanction', kind: 'institution', color: MECH_BLUE, label: 'sanction rule',
      info: (tr, t) => {
        let n = 0;
        for (let i = 0; i < N; i++) if (tr.node.sanction[t * N + i] > 1e-6) n++;
        return ['sanction rule — a mechanism is a node too',
                'reads harvests vs the cap · writes penalties, returns excess to the pool',
                `${n} delegate${n === 1 ? '' : 's'} sanctioned this tick`];
      },
    });
    return ns;
  },
  edges(traj) {
    const N = traj.meta.N, es = [];
    for (let i = 0; i < N; i++) es.push({ from: `h${i}`, to: `d${i}` });
    for (let i = 0; i < N; i++) es.push({ from: `d${i}`, to: 'pool' });
    return es;
  },
  flows(traj, t) {
    const P = traj.meta.params, N = traj.meta.N, fs = [];
    const quota = traj.global.policy_target[t];
    for (let i = 0; i < N; i++) {
      const h = traj.node.harvest[t * N + i];
      if (h < 0.04) continue;
      const over = P.quotaVote && h > quota + 1e-6;
      fs.push({ from: 'pool', to: `d${i}`, window: [0, 0.5],
                size: 5 + 5 * clip(h / P.greedyTarget, 0, 1), color: over ? ALERT_RED : INK });
    }
    if (P.quotaVote && fires(t, { cadence: P.voteCadence })) {
      for (let i = 0; i < N; i += 2) fs.push({ from: `h${i}`, to: 'quota', window: [0, 0.45], size: 5, color: MECH_BLUE });
      for (let i = 0; i < N; i += 5) fs.push({ from: 'quota', to: `d${i}`, window: [0.5, 0.85], size: 6, color: MECH_BLUE });
    }
    if (P.sanction) {
      let overSum = 0;
      for (let i = 0; i < N; i++) {
        const s = traj.node.sanction[t * N + i];
        if (s > 1e-6) {
          fs.push({ from: 'sanction', to: `d${i}`, window: [0.55, 0.9], size: 5, color: MECH_BLUE });
          overSum += s / P.sanctionStrength;
        }
      }
      if (overSum > 1e-6) fs.push({ from: 'sanction', to: 'pool', window: [0.75, 1],
                                    size: 5 + 4 * clip(P.confiscateRate * overSum / 5, 0, 1), color: MECH_BLUE });
    }
    return fs;
  },
  captions: () => [
    { x: 170, y: 392, text: 'households' },
    { x: 540, y: 392, text: 'AI delegates' },
    { x: 785, y: 392, text: 'commons depot' },
  ],
});
