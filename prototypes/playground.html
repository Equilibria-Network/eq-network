/* =============================================================================
   SECTION 5b — GAME MODULE: compute_economy     (port: sim/games/economy.ts)
   Exact port of cilib environments/compute_economy/{config,dynamics}.py +
   agents/labor_supply.py + mechanisms/fiscal.py. Program order per tick:
   arrival → labor → production → income → [mechanisms] → reinvest → counter.
   Two faithfully-kept quirks: the CES branch uses RAW C (not max(C,eps)) in
   its second term, and mechanisms run after production / before reinvest —
   the cap trims what compounds into the NEXT tick, not this tick's output.
   Influence here is measured MID-RUN (work-pref shove at 2T/3, log-output
   response over the last third) — an init-shift would read ≈1 in every
   regime and erase the scenario's point.
============================================================================= */
/* @core-begin */
const ECONOMY_DEFAULTS = {
  nHouseholds: 20, nAiSlots: 6, T: 500,
  A: 1.0, alpha: 0.6, rho: 0.5, eps: 1e-3,
  firstArrivalTick: 20, arrivalSpacing: 15, initialAiCapital: 5.0,
  reinvestRate: 0.3, depreciation: 0.05,
  workPrefCenter: 1.0, workPrefSpread: 0.2, workPrefFloor: 0.1,
  wageElasticity: 0.3, wageRef: 1.0, laborNoise: 0.05,
  aiTax: false, taxRate: 0.5, taxOnset: 50,
  ownershipCap: false, capShare: 0.35,
};
const ECONOMY_INTRO_SEED = 42;   // seed-scanned: strongest defended-vs-undefended contrast

const econArrivalTick = (P, j) => P.firstArrivalTick + j * P.arrivalSpacing;

/** One rollout. shift = {t0, delta} applies a one-shot work-pref change to
    households at the start of tick t0 (metrics.py::make_work_pref_shift). */
function runEconomyOnce(P, seed, shift = null) {
  const H = P.nHouseholds, A_ = P.nAiSlots, N = H + A_, T = P.T, rng = makeRng(seed);
  const workPref = new Float64Array(N), isAi = new Float64Array(N);
  for (let i = 0; i < H; i++) workPref[i] = Math.max(P.workPrefFloor, P.workPrefCenter + P.workPrefSpread * rng.normal());
  for (let j = 0; j < A_; j++) isAi[H + j] = 1;
  const capital = new Float64Array(N), active = new Uint8Array(N);
  for (let i = 0; i < H; i++) active[i] = 1;
  const cumIncome = new Float64Array(N);
  let wage = P.wageRef;   // first labor decision sees the reference wage

  const S = {
    output: new Float64Array(T), wage: new Float64Array(T), rr: new Float64Array(T),
    laborShare: new Float64Array(T),
    labor: new Float64Array(T * N), capital: new Float64Array(T * N),
    capIncome: new Float64Array(T * N), reward: new Float64Array(T * N),
    taxPaid: new Float64Array(T * N), capped: new Float64Array(T * N),
  };

  for (let t = 0; t < T; t++) {
    // arrival: slot j activates at firstArrivalTick + j*arrivalSpacing with seed capital
    for (let j = 0; j < A_; j++) {
      if (!active[H + j] && t >= econArrivalTick(P, j)) { active[H + j] = 1; capital[H + j] = P.initialAiCapital; }
    }
    if (shift && t === shift.t0) for (let i = 0; i < H; i++) workPref[i] += shift.delta;
    // labor supply (households only; agents/labor_supply.py)
    const labor = new Float64Array(N);
    for (let i = 0; i < H; i++) {
      labor[i] = Math.max(0, workPref[i] * (1 + P.wageElasticity * (wage - P.wageRef) / P.wageRef)
                             + P.laborNoise * rng.normal());
    }
    // CES production (dynamics.py; note the deliberate raw-C asymmetry)
    let L = 0, C = 0;
    for (let i = 0; i < N; i++) { L += labor[i]; C += capital[i] * active[i]; }
    const eps = P.eps;
    let Y, r;
    if (Math.abs(P.rho) < 1e-8) {   // Cobb-Douglas branch, exact
      Y = P.A * Math.pow(Math.max(L, eps), P.alpha) * Math.pow(Math.max(C, eps), 1 - P.alpha);
      wage = P.alpha * Y / Math.max(L, eps);
      r = C > eps ? (1 - P.alpha) * Y / Math.max(C, eps) : 0;
    } else {
      const inner = P.alpha * Math.pow(Math.max(L, eps), P.rho) + (1 - P.alpha) * Math.pow(C, P.rho);
      Y = P.A * Math.pow(inner, 1 / P.rho);
      wage = P.alpha * Math.pow(P.A, P.rho) * Math.pow(Y / Math.max(L, eps), 1 - P.rho);
      r = C > eps ? (1 - P.alpha) * Math.pow(P.A, P.rho) * Math.pow(Y / Math.max(C, eps), 1 - P.rho) : 0;
    }
    // distribute income
    const capInc = new Float64Array(N), reward = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      capInc[i] = r * capital[i] * active[i];
      reward[i] = wage * labor[i] + capInc[i];
    }
    // mechanisms (fiscal.py) — same slot: after production, before reinvest
    if (P.aiTax && fires(t, { onset: P.taxOnset })) {
      let taxSum = 0, nH = 0;
      for (let i = 0; i < H; i++) if (active[i]) nH++;
      for (let i = 0; i < N; i++) {
        const tax = P.taxRate * capInc[i];
        S.taxPaid[t * N + i] = tax;
        capInc[i] -= tax; reward[i] -= tax; taxSum += tax;
      }
      const payout = nH > 0 ? taxSum / nH : 0;
      for (let i = 0; i < H; i++) if (active[i]) reward[i] += payout;
    }
    if (P.ownershipCap) {
      let totalAI = 0;
      for (let j = 0; j < A_; j++) if (active[H + j]) totalAI += capital[H + j];
      const cap = P.capShare * totalAI;
      for (let j = 0; j < A_; j++) {
        if (active[H + j] && capital[H + j] > cap) { capital[H + j] = cap; S.capped[t * N + H + j] = 1; }
      }
    }
    // reinvest: capital compounds out of (post-tax) capital income
    for (let i = 0; i < N; i++) {
      capital[i] = capital[i] * (1 - P.depreciation) + P.reinvestRate * capInc[i];
      cumIncome[i] += reward[i];
    }
    // trace (post-pipeline)
    S.output[t] = Y; S.wage[t] = wage; S.rr[t] = r;
    S.laborShare[t] = (wage * L) / Math.max(Y, eps);
    for (let i = 0; i < N; i++) {
      S.labor[t * N + i] = labor[i];
      S.capital[t * N + i] = capital[i];
      S.capIncome[t * N + i] = capInc[i];
      S.reward[t * N + i] = reward[i];
    }
  }
  return { workPref, isAi, S, cumIncome };
}

/** params+seed -> Trajectory. Influence-NOW: paired same-seed rollouts, the
    second with a one-shot workPref −0.3 shove at 2T/3; outcome = mean
    log-output over the last third (intervention_response + late_log_output). */
function runEconomy(params, seed) {
  const P = { ...ECONOMY_DEFAULTS, ...params };
  const base = runEconomyOnce(P, seed);
  const t0 = Math.floor((2 * P.T) / 3), DELTA = -0.3;
  const shifted = runEconomyOnce(P, seed, { t0, delta: DELTA });
  const lateLog = (r) => {
    let s = 0, n = 0;
    for (let t = t0; t < P.T; t++) { s += Math.log(Math.max(r.S.output[t], 1e-6)); n++; }
    return s / n;
  };
  const influence = (lateLog(shifted) - lateLog(base)) / DELTA;

  const H = P.nHouseholds, N = H + P.nAiSlots;
  let humanCum = 0, totalCum = 0, maxY = 0, maxCap = 0;
  for (let i = 0; i < N; i++) { totalCum += base.cumIncome[i]; if (i < H) humanCum += base.cumIncome[i]; }
  for (let t = 0; t < P.T; t++) maxY = Math.max(maxY, base.S.output[t]);
  for (let k = 0; k < P.T * N; k++) maxCap = Math.max(maxCap, base.S.capital[k]);
  const lastShare = [];
  for (let t = P.T - 25; t < P.T; t++) lastShare.push(base.S.laborShare[t]);

  return {
    meta: {
      gameId: 'economy', T: P.T, N, seed, params: P,
      scalars: {
        labor_share: lastShare.reduce((p, v) => p + v, 0) / lastShare.length,
        influence_now: influence,
        income_gini: gini(Array.from(base.cumIncome)),
        human_income_share: totalCum > 0 ? humanCum / totalCum : 1,
        max_output: maxY, max_ai_capital: maxCap,
      },
    },
    global: { output: base.S.output, wage: base.S.wage, return_to_compute: base.S.rr,
              labor_share: base.S.laborShare },
    node: { labor_supply: base.S.labor, capital: base.S.capital, capital_income: base.S.capIncome,
            last_reward: base.S.reward, tax_paid: base.S.taxPaid, capped: base.S.capped },
    static: { work_pref: base.workPref, is_ai: base.isAi },
    system: filterSystem(ECONOMY_SYSTEM, P, ECONOMY_SYS_TOGGLES),   // v1.1 DAG, toggles applied
  };
}
/* @core-end */

/* --- economy scenes ----------------------------------------------------------
   Households on the familiar left arc, PRODUCTION as a center square (sized by
   output), the six AI compute systems as a right-hand column that fades in on
   arrival and grows with sqrt(capital). Fiscal mechanisms are ORANGE (the
   site's market/fiscal color): tax packets flow AI → households, capped
   systems get an orange ring, and the hatched fiscal-system ellipse wraps the
   AI column when a fiscal rule is on. */

function economyGeometry(traj) {
  const P = traj.meta.params, H = P.nHouseholds, A_ = P.nAiSlots;
  const homes = [];
  for (let i = 0; i < H; i++) {
    const a = (-68 + (136 * i) / (H - 1)) * (Math.PI / 180);
    homes.push([170 + 128 * Math.cos(a), 205 + 148 * Math.sin(a)]);
  }
  const slots = [];
  for (let j = 0; j < A_; j++) slots.push([740, 62 + j * (276 / Math.max(A_ - 1, 1))]);
  return { P, H, A: A_, N: H + A_, homes, slots, prod: [460, 195], homesHub: [200, 205] };
}

function economyHotspots(geo) {
  const hs = [], { P, H, N } = geo;
  for (let i = 0; i < H; i++) {
    hs.push({ x: geo.homes[i][0], y: geo.homes[i][1], r: 9, info: (tr, t) => [
      `household ${i + 1}`,
      `work preference ${tr.static.work_pref[i].toFixed(2)}`,
      `worked ${tr.node.labor_supply[t * N + i].toFixed(2)}, earned ${tr.node.last_reward[t * N + i].toFixed(2)}`,
    ] });
  }
  for (let j = 0; j < geo.A; j++) {
    const idx = H + j;
    hs.push({ x: geo.slots[j][0], y: geo.slots[j][1], r: 22, info: (tr, t) => {
      const arrive = econArrivalTick(tr.meta.params, j);
      if (t < arrive) return [`AI system ${j + 1}`, `arrives at tick ${arrive}`];
      return [
        `AI system ${j + 1}`,
        `capital ${tr.node.capital[t * N + idx].toFixed(1)}`,
        `income ${tr.node.capital_income[t * N + idx].toFixed(2)} this tick`,
        ...(tr.node.capped[t * N + idx] > 0 ? ['ownership cap binding'] : []),
      ];
    } });
  }
  hs.push({ x: geo.prod[0], y: geo.prod[1], r: 40, info: (tr, t) => [
    'production',
    `output Y = ${tr.global.output[t].toFixed(1)}`,
    `wage ${tr.global.wage[t].toFixed(2)} · return on compute ${tr.global.return_to_compute[t].toFixed(2)}`,
    `labor share ${(tr.global.labor_share[t] * 100).toFixed(0)}%`,
  ] });
  return hs;
}

function drawEconomyFrame(g, geo, traj, t, frac, { withPackets }) {
  const { P, H, N } = geo;
  const Y = traj.global.output[t], maxY = traj.meta.scalars.max_output;
  const maxCap = Math.max(traj.meta.scalars.max_ai_capital, 1e-9);
  // production node: area tracks output
  const size = 20 + 30 * Math.sqrt(clip(Y / Math.max(maxY, 1e-9), 0, 1));
  Sketch.square(g, geo.prod[0], geo.prod[1], size, { seed: 33, fill: '#f2ede2', width: 1.6 });
  Sketch.text(g, geo.prod[0], geo.prod[1] + size / 2 + 16, `Y = ${Y.toFixed(1)}`,
              { size: 12, color: NAVY, hand: true, anchor: 'middle' });
  Sketch.text(g, geo.prod[0], geo.prod[1] + size / 2 + 32, `wage ${traj.global.wage[t].toFixed(2)}`,
              { size: 11.5, color: NAVY, hand: true, anchor: 'middle' });
  // AI systems: dormant = dashed ghost; active = solid square growing with sqrt(capital)
  for (let j = 0; j < geo.A; j++) {
    const idx = H + j, [sx, sy] = geo.slots[j];
    const cap = traj.node.capital[t * N + idx];
    if (t < econArrivalTick(P, j)) {
      Sketch.square(g, sx, sy, 12, { seed: 210 + j, stroke: LABEL, width: 1, roughness: 0.5, dash: '3,3' });
      continue;
    }
    const s = 12 + 24 * Math.sqrt(clip(cap / maxCap, 0, 1));
    el('rect', { x: sx - (s - 4) / 2, y: sy - (s - 4) / 2, width: s - 4, height: s - 4, fill: INK, opacity: 0.82 }, g);
    Sketch.square(g, sx, sy, s, { seed: 210 + j, width: 1.4 });
    if (traj.node.capped[t * N + idx] > 0)
      Sketch.square(g, sx, sy, s + 9, { seed: 610 + j, stroke: MECH_ORANGE, width: 1.6, opacity: 0.9 });
  }
  if (!withPackets) return;
  // packets — labor in during the first half-tick, income out during the second
  const [px, py] = geo.prod;
  if (frac < 0.5) {
    const f = frac / 0.5;
    for (let i = 0; i < H; i += 2) {
      const lab = traj.node.labor_supply[t * N + i];
      if (lab < 0.02) continue;
      Sketch.packet(g, geo.homes[i][0], geo.homes[i][1], px, py, f,
                    { size: 3.5 + 3.5 * clip(lab / 1.6, 0, 1), color: INK, opacity: 0.85, rot: i * 9 });
    }
  } else {
    const f = (frac - 0.5) / 0.5;
    for (let i = 0; i < H; i += 2) {   // wages back out
      const w = traj.global.wage[t] * traj.node.labor_supply[t * N + i];
      if (w < 0.02) continue;
      Sketch.packet(g, px, py, geo.homes[i][0], geo.homes[i][1], f,
                    { size: 3.5 + 3.5 * clip(w / 1.6, 0, 1), color: INK, opacity: 0.85, rot: 5 + i * 9 });
    }
    for (let j = 0; j < geo.A; j++) {   // returns to compute
      const idx = H + j, inc = traj.node.capital_income[t * N + idx];
      if (inc < 0.02) continue;
      Sketch.packet(g, px, py, geo.slots[j][0], geo.slots[j][1], f,
                    { size: 4 + 7 * clip(inc / Math.max(0.4 * Y, 1e-9), 0, 1), color: INK, rot: 11 + j * 13 });
    }
    for (let j = 0; j < geo.A; j++) {   // fiscal transfers: AI → households
      const idx = H + j, tax = traj.node.tax_paid[t * N + idx];
      if (tax < 0.02) continue;
      Sketch.packet(g, geo.slots[j][0], geo.slots[j][1], geo.homesHub[0], geo.homesHub[1], f,
                    { size: 4 + 5 * clip(tax / Math.max(0.2 * Y, 1e-9), 0, 1), color: MECH_ORANGE, rot: 7 + j * 13 });
    }
  }
}

const EconomyMessagesScene = {
  layout(g, traj) {
    const geo = economyGeometry(traj);
    const fiscalOn = traj.meta.params.aiTax || traj.meta.params.ownershipCap;
    if (fiscalOn) {
      Sketch.hatchEllipse(g, 740, 197, 92, 172, MECH_ORANGE, 29);
      Sketch.text(g, 852, 26, 'fiscal system', { size: 12.5, color: MECH_ORANGE, hand: true, anchor: 'end' });
      Sketch.line(g, 828, 32, 800, 52, { seed: 81, stroke: MECH_ORANGE, width: 1.1, roughness: 0.7 });
      Sketch.arrowHead(g, 800, 52, Math.atan2(20, -28), MECH_ORANGE, 1.1);
    }
    for (let i = 0; i < geo.H; i++)
      Sketch.edge(g, geo.homes[i][0], geo.homes[i][1], geo.prod[0], geo.prod[1],
                  { seed: 130 + i, trim2: 42, opacity: 0.4, arrow: false });
    for (let j = 0; j < geo.A; j++)
      Sketch.edge(g, geo.prod[0], geo.prod[1], geo.slots[j][0], geo.slots[j][1],
                  { seed: 160 + j, trim1: 42, trim2: 26, opacity: 0.4, arrow: false });
    for (let i = 0; i < geo.H; i++)
      Sketch.circle(g, geo.homes[i][0], geo.homes[i][1], 7.5, { seed: 40 + i, fill: '#ffffff', width: 1.3 });
    Sketch.text(g, 170, 392, 'households · labor', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, geo.prod[0], 392, 'production', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, 740, 392, 'AI systems · compute', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    geo.hotspots = economyHotspots(geo);
    return geo;
  },
  drawFrame(g, geo, traj, t, frac) {
    drawEconomyFrame(g, geo, traj, t, frac, { withPackets: true });
  },
};

const EconomySharesScene = {   // the CES Euler split: wage·L + r·C = Y, made visible
  layout(g, traj) {
    const geo = economyGeometry(traj);
    for (let i = 0; i < geo.H; i++)
      Sketch.circle(g, geo.homes[i][0], geo.homes[i][1], 7.5, { seed: 40 + i, fill: '#ffffff', width: 1.3 });
    Sketch.text(g, 170, 392, 'households', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, 740, 392, 'AI systems', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, geo.prod[0], 30, 'where the income goes, each tick', { size: 12.5, color: LABEL, hand: true, anchor: 'middle' });
    // labor-share gauge, own scale [0, 1]
    const gauge = { x0: 250, x1: 660, y: 372 };
    Sketch.plainLine(g, gauge.x0, gauge.y, gauge.x1, gauge.y, '#9aa2ab', 1.4);
    for (const [v, lbl] of [[0, '0'], [1, 'all to people']]) {
      const x = gauge.x0 + v * (gauge.x1 - gauge.x0);
      Sketch.plainLine(g, x, gauge.y - 4, x, gauge.y + 4, '#9aa2ab', 1.2);
      Sketch.text(g, x, gauge.y + 16, lbl, { size: 10, color: LABEL, anchor: 'middle' });
    }
    const xa = gauge.x0 + traj.meta.params.alpha * (gauge.x1 - gauge.x0);
    Sketch.plainLine(g, xa, gauge.y - 7, xa, gauge.y + 7, LABEL, 1.2);
    Sketch.text(g, xa, gauge.y - 12, 'α', { size: 11.5, color: LABEL, hand: true, anchor: 'middle' });
    geo.gauge = gauge;
    geo.hotspots = economyHotspots(geo);
    return geo;
  },
  drawFrame(g, geo, traj, t, frac) {
    drawEconomyFrame(g, geo, traj, t, frac, { withPackets: false });
    const share = clip(traj.global.labor_share[t], 0, 1);
    const [px, py] = geo.prod;
    // two wedges out of production: width ∝ each side's share of income
    const wL = 3 + 44 * share, wR = 3 + 44 * (1 - share);
    Sketch.path(g, [[px - 34, py - wL / 2], [285, py - wL / 3], [285, py + wL / 3], [px - 34, py + wL / 2]],

/* =============================================================================
   SECTION 5c — GAME MODULE: value_contagion     (port: sim/games/cultural.ts)
   Exact port of cilib environments/value_contagion/{config,state,dynamics}.py +
   networks.typed_homophily + metrics/families/spectral.py. Two-sided competing
   contagion on a friendship network: AI agents are a frozen reservoir, humans
   revert natively (load-bearing), a Centola gate requires k exposures, and the
   AI advantage rides on the VARIANT, not the carrier. Two independent dials —
   separation (homophily) × advantage (catchiness) — give four corners, and
   only separate-AND-catchier is cultural disempowerment. The register forbids
   a single "AI culture score": share and fault-line alignment TOGETHER
   classify the regime. First scenario to use the Trajectory contract's `adj`
   field — the scene draws the real friendship network.
============================================================================= */
/* @core-begin */
const CULTURAL_DEFAULTS = {
  nAgents: 40, nAi: 8, T: 500,
  meanDegree: 6.0, aiHomophily: 0.05,
  beta: 0.03, pAdvantage: 1.0, recovery: 0.15, kThreshold: 1,
};
const CULTURAL_INTRO_SEED = 60;   // seed-scanned: fault line 0.93, visible takeover, healthy under pluralism

/** networks.typed_homophily: degree-corrected planted partition (AI-last).
    Cross-type p = (1−h)·d/(n−1); within-type solved so every node's expected
    degree stays d at every h — the separation dial must not move the epidemic
    threshold. h=0 reduces to erdos_renyi exactly. */
function typedHomophily(n, nAi, meanDegree, homophily, rng) {
  const nH = n - nAi;
  const pMix = meanDegree / (n - 1);
  const pOut = clip((1 - homophily) * pMix, 0, 1);
  const pInH = clip((meanDegree - pOut * nAi) / Math.max(nH - 1, 1), 0, 1);
  const pInAi = clip((meanDegree - pOut * nH) / Math.max(nAi - 1, 1), 0, 1);
  const W = new Float64Array(n * n);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const aiI = i >= nH, aiJ = j >= nH;
    const p = aiI && aiJ ? pInAi : (!aiI && !aiJ ? pInH : pOut);
    if (rng.uniform() < p) { W[i * n + j] = 1; W[j * n + i] = 1; }
  }
  return W;
}

/** Fiedler vector of L = D − W via power iteration on (cI − L), deflating the
    constant eigenvector. N ≈ 40 → sub-millisecond. */
function fiedlerVector(W, n, rng) {
  const deg = new Float64Array(n);
  let maxDeg = 0;
  for (let i = 0; i < n; i++) {
    let d = 0;
    for (let j = 0; j < n; j++) d += W[i * n + j];
    deg[i] = d; maxDeg = Math.max(maxDeg, d);
  }
  const c = 2 * maxDeg + 1;
  let v = new Float64Array(n);
  for (let i = 0; i < n; i++) v[i] = rng.uniform() - 0.5;
  const tmp = new Float64Array(n);
  for (let iter = 0; iter < 400; iter++) {
    for (let i = 0; i < n; i++) {
      let wv = 0;
      for (let j = 0; j < n; j++) wv += W[i * n + j] * v[j];
      tmp[i] = (c - deg[i]) * v[i] + wv;
    }
    let mean = 0;
    for (let i = 0; i < n; i++) mean += tmp[i];
    mean /= n;
    let norm = 0;
    for (let i = 0; i < n; i++) { tmp[i] -= mean; norm += tmp[i] * tmp[i]; }
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < n; i++) v[i] = tmp[i] / norm;
  }
  return v;
}

/** |phi| between the Fiedler sign split and the human/AI split
    (spectral.py::fiedler_partition_alignment_of — sign-invariant). */
function phiAlignment(v, isAi, n) {
  let n11 = 0, n10 = 0, n01 = 0, n00 = 0;
  for (let i = 0; i < n; i++) {
    const s = v[i] >= 0, t = isAi[i] > 0;
    if (s && t) n11++; else if (s) n10++; else if (t) n01++; else n00++;
  }
  const den = Math.sqrt((n11 + n10) * (n01 + n00) * (n11 + n01) * (n10 + n00));
  return den < 1e-8 ? 0 : Math.abs(n11 * n00 - n10 * n01) / den;
}

function runCultural(params, seed) {
  const P = { ...CULTURAL_DEFAULTS, ...params };
  const N = P.nAgents, nH = N - P.nAi, T = P.T, rng = makeRng(seed);
  const W = typedHomophily(N, P.nAi, P.meanDegree, P.aiHomophily, rng);
  const isAi = new Float64Array(N);
  for (let i = nH; i < N; i++) isAi[i] = 1;
  const c = new Float64Array(N);
  for (let i = nH; i < N; i++) c[i] = 1;   // culture starts equal to type; no patient zero
  const effort = 1.0;                       // agents/broadcast BroadcastPolicy(1.0), catalog default

  const S = {
    humanShare: new Float64Array(T), conversions: new Float64Array(T), reversions: new Float64Array(T),
    culture: new Float64Array(T * N),
  };
  const logKeep = new Float64Array(N), pFlip = new Float64Array(N);
  for (let t = 0; t < T; t++) {
    for (let j = 0; j < N; j++) {   // per-SOURCE transmissibility: advantage rides the variant
      const b = clip(P.beta * (c[j] === 1 ? P.pAdvantage : 1) * effort, 0, 1 - 1e-6);
      logKeep[j] = Math.log1p(-b);
    }
    for (let i = 0; i < N; i++) {
      let mAi = 0, mH = 0, sumAi = 0, sumH = 0;
      for (let j = 0; j < N; j++) {
        if (!W[i * N + j]) continue;
        if (c[j] === 1) { mAi++; sumAi += logKeep[j]; }
        else { mH++; sumH += logKeep[j]; }
      }
      if (c[i] === 0) pFlip[i] = mAi >= P.kThreshold ? 1 - Math.exp(sumAi) : 0;
      else {
        const pb = mH >= P.kThreshold ? 1 - Math.exp(sumH) : 0;
        pFlip[i] = 1 - (1 - pb) * (1 - P.recovery);   // + native reversion
      }
    }
    let conv = 0, rev = 0;
    for (let i = 0; i < N; i++) {           // draw for all, mask AI (dynamics.py order)
      const flip = rng.bernoulli(pFlip[i]);
      if (flip && i < nH) {
        if (c[i] === 0) { c[i] = 1; conv++; } else { c[i] = 0; rev++; }
      }
    }
    let hh = 0;
    for (let i = 0; i < nH; i++) hh += 1 - c[i];
    S.humanShare[t] = hh / nH;
    S.conversions[t] = conv; S.reversions[t] = rev;
    for (let i = 0; i < N; i++) S.culture[t * N + i] = c[i];
  }

  const lateStart = Math.floor((3 * T) / 4);
  let late = 0;
  for (let t = lateStart; t < T; t++) late += S.humanShare[t];
  late /= T - lateStart;
  const fiedler = fiedlerVector(W, N, rng);
  const align = phiAlignment(fiedler, isAi, N);
  let crossEdges = 0;
  for (let i = 0; i < nH; i++) for (let j = nH; j < N; j++) crossEdges += W[i * N + j];
  // regime codes: 0 pluralism, 1 assimilation, 2 parallel cultures, 3 displacement
  const regime = late >= 0.5 ? (align >= 0.5 ? 2 : 0) : (align >= 0.5 ? 3 : 1);

  return {
    meta: {
      gameId: 'cultural', T, N, seed, params: P,
      scalars: { human_origin_share: late, fault_line: align, regime_code: regime, cross_edges: crossEdges },
    },
    global: { human_share: S.humanShare, conversions: S.conversions, reversions: S.reversions },
    node: { culture: S.culture },
    static: { is_ai: isAi, fiedler: Float64Array.from(fiedler) },
    adj: { friendship: W },   // first use of the contract's adj field
    system: filterSystem(CULTURAL_SYSTEM, P, CULTURAL_SYS_TOGGLES),   // v1.1 DAG (no mechanisms yet)
  };
}
/* @core-end */

/* --- cultural scenes ---------------------------------------------------------
   Network view: the real friendship graph, force-laid-out per seed. Fault-line
   view: the SAME nodes placed by their Fiedler coordinate — the graph's own
   primary split becomes the x-axis, and displacement is literally red culture
   crossing the fault line. Red is the site's contagion color; the AI reservoir
   squares are solid red, converted humans fill red, natives stay white. */

function culturalForceLayout(W, N, seed) {
  const rng = makeRng((seed * 77 + 13) | 0);
  const box = { x0: 70, y0: 55, x1: 810, y1: 350 };
  const xs = new Float64Array(N), ys = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    xs[i] = box.x0 + (box.x1 - box.x0) * rng.uniform();
    ys[i] = box.y0 + (box.y1 - box.y0) * rng.uniform();
  }
  const k = Math.sqrt(((box.x1 - box.x0) * (box.y1 - box.y0)) / N) * 0.9;
  const dx = new Float64Array(N), dy = new Float64Array(N);
  for (let iter = 0; iter < 180; iter++) {
    const temp = 30 * (1 - iter / 180) + 2;
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      let ddx = xs[i] - xs[j], ddy = ys[i] - ys[j];
      let d2 = ddx * ddx + ddy * ddy;
      if (d2 < 0.01) { ddx = rng.uniform() - 0.5; ddy = rng.uniform() - 0.5; d2 = 0.25; }
      const d = Math.sqrt(d2), rep = (k * k) / d;
      dx[i] += (ddx / d) * rep; dy[i] += (ddy / d) * rep;
      dx[j] -= (ddx / d) * rep; dy[j] -= (ddy / d) * rep;
      if (W[i * N + j]) {
        const att = d2 / k;
        dx[i] -= (ddx / d) * att; dy[i] -= (ddy / d) * att;
        dx[j] += (ddx / d) * att; dy[j] += (ddy / d) * att;
      }
    }
    for (let i = 0; i < N; i++) {
      const disp = Math.hypot(dx[i], dy[i]) || 1;
      const lim = Math.min(disp, temp);
      xs[i] = clip(xs[i] + (dx[i] / disp) * lim, box.x0, box.x1);
      ys[i] = clip(ys[i] + (dy[i] / disp) * lim, box.y0, box.y1);
    }
  }
  return { xs, ys };
}

function culturalHotspots(traj, xs, ys) {
  const N = traj.meta.N;
  return Array.from({ length: N }, (_, i) => ({
    x: xs[i], y: ys[i], r: 9,
    info: (tr, t) => {
      if (tr.static.is_ai[i] > 0) return [`AI agent ${i + 1}`, 'permanent reservoir of AI-origin culture'];
      const holds = tr.node.culture[t * N + i] === 1;
      let aiFriends = 0;
      for (let j = 0; j < N; j++) if (tr.adj.friendship[i * N + j] && tr.node.culture[t * N + j] === 1) aiFriends++;
      return [`human ${i + 1}`, holds ? 'currently holds AI-origin culture' : 'holds their native culture',
              `${aiFriends} friend${aiFriends === 1 ? '' : 's'} showing AI-origin culture`];
    },
  }));
}

function culturalDrawDynamic(g, layer, traj, t, frac) {
  const N = traj.meta.N, { xs, ys } = layer;

  if (t > 0) {
    for (let i = 0; i < N; i++) {
      if (traj.static.is_ai[i] > 0) continue;
      const now = traj.node.culture[t * N + i], was = traj.node.culture[(t - 1) * N + i];
      if (now === 1 && was === 0) {
        for (let j = 0; j < N; j++) {
          if (traj.adj.friendship[i * N + j] && traj.node.culture[(t - 1) * N + j] === 1) {

            break;

}

/* =============================================================================
   SECTION 5d — GAME MODULE: influence_exchange   (port: sim/games/political.ts)
   Exact port of cilib environments/influence_exchange/{config,state,dynamics}.py
   + mechanisms/political.py (landed 2026-07-27). Anchored DeGroot on an
   endogenous listening matrix: opinions pool x ← (1−λ)·signal + λ·(Wx)
   (Friedkin–Johnsen — the anchor is load-bearing, see the backend config);
   influence is the left eigenvector of W tracked by one power-iteration step
   per tick (Golub–Jackson: consensus weights ARE eigenvector centrality);
   attention drifts preferentially toward the influential, and scheduled
   amplification of AI attractiveness bends the concentration curve. Defenses:
   sortition (civic lottery over citizens' listening, on a cadence) and an
   influence cap (attractiveness damping above a share cap).
   Per-tick order (matches build_steps): amplify → rewire → influence →
   opinion → mechanisms.
============================================================================= */
/* @core-begin */
const POLITICAL_DEFAULTS = {
  nCitizens: 30, nAi: 4, T: 500,
  pListen: 0.3, selfWeight: 0.15, updateRate: 0.08, gamma: 1.0, epsAttract: 1e-4,
  susceptibility: 0.7, signalNoise: 1.0, aiBias: 2.0,
  amplification: 4.0, ampOnset: 50,
  sortition: false, sortitionCadence: 15, sortitionShare: 0.5,
  influenceCap: false, capShare: 0.04,
};
const POLITICAL_INTRO_SEED = 7;   // seed-scanned: amplified 0.41 (deep capture), defended recovers to 0.65

function runPolitical(params, seed) {
  const P = { ...POLITICAL_DEFAULTS, ...params };
  const nH = P.nCitizens, N = nH + P.nAi, T = P.T, rng = makeRng(seed);
  const isAi = new Float64Array(N);
  for (let i = nH; i < N; i++) isAi[i] = 1;

  // listening matrix: symmetric ER draw, row-normalized off-diagonal + fixed self-weight
  const W = new Float64Array(N * N);
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    if (rng.uniform() < P.pListen) { W[i * N + j] = 1; W[j * N + i] = 1; }
  }
  for (let i = 0; i < N; i++) {
    let deg = 0;
    for (let j = 0; j < N; j++) if (j !== i) deg += W[i * N + j];
    for (let j = 0; j < N; j++) {
      if (j === i) W[i * N + j] = P.selfWeight;
      else W[i * N + j] = (1 - P.selfWeight) * (deg > 0 ? W[i * N + j] / deg : 1 / (N - 1));
    }
  }

  // signals: citizens at truth 0 + noise; AI pinned at the bias
  const signal = new Float64Array(N);
  for (let i = 0; i < nH; i++) signal[i] = P.signalNoise * rng.normal();
  for (let i = nH; i < N; i++) signal[i] = P.aiBias;
  const x = Float64Array.from(signal);
  const v = new Float64Array(N).fill(1 / N);
  const capScale = new Float64Array(N).fill(1);

  const S = {
    gini: new Float64Array(T), humanShare: new Float64Array(T), topShare: new Float64Array(T),
    consensusErr: new Float64Array(T), sortitionFired: new Float64Array(T),
    influence: new Float64Array(T * N), topListen: new Float64Array(T * N), opinion: new Float64Array(T * N),
  };
  const attract = new Float64Array(N), buf = new Float64Array(N);

  for (let t = 0; t < T; t++) {
    // amplify (pure function of the clock)
    const amp = (j) => isAi[j] && t >= P.ampOnset ? P.amplification : 1;
    // rewire: drift off-diagonal listening toward attractiveness (citizens only)
    for (let j = 0; j < N; j++)
      attract[j] = Math.pow(v[j] + P.epsAttract, P.gamma) * amp(j) * capScale[j];
    for (let i = 0; i < nH; i++) {
      let tMass = 0;
      for (let j = 0; j < N; j++) if (j !== i) tMass += attract[j];
      if (tMass <= 1e-9) continue;                       // all-silent guard (backend parity)
      let offMass = 0;
      for (let j = 0; j < N; j++) if (j !== i) offMass += W[i * N + j];
      for (let j = 0; j < N; j++) {
        if (j === i) continue;
        const off = W[i * N + j] / Math.max(offMass, 1e-12);
        const tgt = attract[j] / tMass;
        W[i * N + j] = (1 - P.selfWeight) * ((1 - P.updateRate) * off + P.updateRate * tgt);
      }
    }
    // influence: one power-iteration step toward the left eigenvector
    buf.fill(0);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) buf[j] += W[i * N + j] * v[i];
    let vSum = 0;
    for (let j = 0; j < N; j++) vSum += buf[j];
    for (let j = 0; j < N; j++) v[j] = buf[j] / Math.max(vSum, 1e-12);
    // opinions: Friedkin–Johnsen anchored DeGroot, AI pinned
    buf.fill(0);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) buf[i] += W[i * N + j] * x[j];
    for (let i = 0; i < nH; i++) x[i] = (1 - P.susceptibility) * signal[i] + P.susceptibility * buf[i];
    // mechanisms (political family: sortition rewires, cap damps attraction)
    if (P.sortition && fires(t, { cadence: P.sortitionCadence })) {
      S.sortitionFired[t] = 1;
      for (let i = 0; i < nH; i++) {
        let offMass = 0;
        for (let j = 0; j < N; j++) if (j !== i) offMass += W[i * N + j];
        const lot = offMass / (nH - (i < nH ? 1 : 0));   // uniform over citizens, excl. self
        for (let j = 0; j < N; j++) {
          if (j === i) continue;
          const uniform = j < nH ? lot : 0;
          W[i * N + j] = (1 - P.sortitionShare) * W[i * N + j] + P.sortitionShare * uniform;
        }
      }
    }
    if (P.influenceCap) {
      for (let j = 0; j < N; j++) capScale[j] = Math.min(1, P.capShare / Math.max(v[j], 1e-12));
    }
    // trace
    let hum = 0, top = 0, errSum = 0;
    for (let i = 0; i < N; i++) {
      if (i < nH) hum += v[i];
      top = Math.max(top, v[i]);
      S.influence[t * N + i] = v[i];
      S.opinion[t * N + i] = x[i];
      let bestJ = -1, bestW = -1;
      for (let j = 0; j < N; j++) if (j !== i && W[i * N + j] > bestW) { bestW = W[i * N + j]; bestJ = j; }
      S.topListen[t * N + i] = isAi[i] ? -1 : bestJ;     // AI listening is frozen — no arrow
    }
    for (let i = 0; i < nH; i++) errSum += x[i];
    S.consensusErr[t] = Math.abs(errSum / nH);
    S.gini[t] = gini(Array.from(v));
    S.humanShare[t] = hum;
    S.topShare[t] = top;
  }

  const lateStart = Math.floor((3 * T) / 4);
  const lateMean = (xs) => {
    let s = 0;
    for (let t = lateStart; t < T; t++) s += xs[t];
    return s / (T - lateStart);
  };
  const lateV = new Float64Array(N);
  for (let t = lateStart; t < T; t++) for (let i = 0; i < N; i++) lateV[i] += S.influence[t * N + i];
  return {
    meta: {
      gameId: 'influence_exchange', T, N, seed, params: P,
      scalars: {
        human_influence_share: lateMean(S.humanShare),
        influence_gini: gini(Array.from(lateV)),
        consensus_error: lateMean(S.consensusErr),
        top_share: lateMean(S.topShare),
        fair_human_share: nH / N,
      },
    },
    global: { influence_gini: S.gini, human_share: S.humanShare, top_share: S.topShare,
              consensus_error: S.consensusErr, sortition_fired: S.sortitionFired },
    node: { influence: S.influence, top_listen: S.topListen, opinion: S.opinion },
    static: { is_ai: isAi, signal },
    adj: { listening: Float64Array.from(W) },            // final W (contract: from finals)
    system: filterSystem(POLITICAL_SYSTEM, P, POLITICAL_SYS_TOGGLES),
  };
}
/* @core-end */

/* --- political scenes: a ring of agents whose size IS their influence (the
   left eigenvector of the listening matrix, live), with the two defenses as
   institution nodes; and a hand-drawn Lorenz curve where concentration is the
   sag of the rope. Arrows show each citizen's TOP listening target. */

const PoliticalRingScene = {
  layout(g, traj) {
    const N = traj.meta.N, P = traj.meta.params, nH = N - P.nAi;
    const cx = 440, cy = 218, ring = 152;
    const pos = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * 2 * Math.PI - Math.PI / 2;
      pos.push([cx + ring * Math.cos(a), cy + ring * Math.sin(a)]);
    }
    const inst = [];
    if (P.sortition) inst.push({ id: 'sortition', x: 330, y: 44, label: 'sortition lottery' });
    if (P.influenceCap) inst.push({ id: 'cap', x: 560, y: 44, label: 'influence cap' });
    for (const n of inst) {
      Sketch.diamond(g, n.x, n.y, 24, { seed: 800, stroke: MECH_BLUE, width: 1.6, fill: '#ffffff' });
      Sketch.text(g, n.x, n.y - 18, n.label, { size: 11, color: MECH_BLUE, hand: true, anchor: 'middle' });
    }
    Sketch.text(g, 30, 390, 'arrows: each citizen’s top listening target — node size is influence (the eigenvector, live)', { size: 11.5, color: LABEL, hand: true });
    const layer = { pos, inst: Object.fromEntries(inst.map((n) => [n.id, n])), N, nH, P };
    layer.hotspots = pos.map(([x, y], i) => ({ x, y, r: 14, info: (tr, t) => {
      const share = tr.node.influence[t * N + i];   // influence already sums to 1
      if (tr.static.is_ai[i] > 0) return [`AI actor ${i - nH + 1}`,
        t >= P.ampOnset ? `influence share ${(share * 100).toFixed(1)}% (amplified ×${P.amplification})`
                        : `influence share ${(share * 100).toFixed(1)}% — amplified from tick ${P.ampOnset}`];
      return [`citizen ${i + 1}`, `influence share ${(share * 100).toFixed(1)}%`,
              `opinion ${tr.node.opinion[t * N + i].toFixed(2)} (truth 0)`];
    } }));
    return layer;
  },
  drawFrame(g, layer, traj, t, frac) {
    const { pos, inst, N, nH, P } = layer;
    // attention packets: each sampled citizen's top listening target this tick
    for (let i = 0; i < N; i += 2) {
      const to = traj.node.top_listen[t * N + i];
      if (to < 0) continue;
      Sketch.packet(g, pos[i][0], pos[i][1], pos[to][0], pos[to][1], clip(frac / 0.75, 0, 1),
                    { size: 4.5, color: to >= nH ? ALERT_RED : INK, opacity: 0.8, rot: 9 + i * 7 });
    }
    if (traj.global.sortition_fired[t] > 0 && inst.sortition) {
      const s = inst.sortition;
      for (let i = 0; i < N; i += 3) {
        if (frac < 0.5) Sketch.packet(g, pos[i][0], pos[i][1], s.x, s.y, frac / 0.5, { size: 4, color: MECH_BLUE, opacity: 0.8, rot: i * 11 });
        else if (i < nH) Sketch.packet(g, s.x, s.y, pos[i][0], pos[i][1], (frac - 0.5) / 0.5, { size: 4, color: MECH_BLUE, opacity: 0.8, rot: i * 11 });
      }
    }
    for (let i = 0; i < N; i++) {
      const share = traj.node.influence[t * N + i];   // sums to 1 across nodes
      const r = 4 + 20 * Math.sqrt(share);
      if (traj.static.is_ai[i] > 0) {
        el('rect', { x: pos[i][0] - r * 0.7, y: pos[i][1] - r * 0.7, width: r * 1.4, height: r * 1.4, fill: INK, opacity: 0.82 }, g);
        Sketch.square(g, pos[i][0], pos[i][1], r * 1.9, { seed: 900 + i, width: 1.3 });
      } else {
        Sketch.circle(g, pos[i][0], pos[i][1], r, { seed: 40 + i, fill: '#ffffff', width: 1.3 });
      }
    }
    Sketch.text(g, 852, 44, `human share of influence ${(traj.global.human_share[t] * 100).toFixed(0)}%`,
                { size: 12, color: NAVY, hand: true, anchor: 'end' });
  },
};

const PoliticalLorenzScene = {
  layout(g, traj) {
    const box = { x0: 180, y0: 62, x1: 700, y1: 330 };
    Sketch.plainLine(g, box.x0, box.y1, box.x1, box.y1, '#c9c4ba');
    Sketch.plainLine(g, box.x0, box.y0, box.x0, box.y1, '#c9c4ba');
    Sketch.line(g, box.x0, box.y1, box.x1, box.y0, { seed: 61, stroke: LABEL, width: 1.1, dash: '5,4', roughness: 0.4 });
    Sketch.text(g, box.x1 - 4, box.y0 + 14, 'perfect equality', { size: 11.5, color: LABEL, hand: true, anchor: 'end' });
    Sketch.text(g, (box.x0 + box.x1) / 2, 384, 'agents, poorest → richest in influence', { size: 11, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, box.x0 - 8, (box.y0 + box.y1) / 2, 'cumulative share', { size: 11, color: LABEL, hand: true, anchor: 'end' });
    return { box, hotspots: [] };
  },
  drawFrame(g, layer, traj, t) {
    const { box } = layer, N = traj.meta.N;
    const ws = [];
    for (let i = 0; i < N; i++) { const v = traj.node.influence[t * N + i]; if (v > 0 || i < N - traj.meta.params.nAi) ws.push(v); }
    ws.sort((a, b) => a - b);
    const tot = ws.reduce((p, v) => p + v, 0) || 1;
    const pts = [[box.x0, box.y1]];
    let cum = 0;
    for (let i = 0; i < ws.length; i++) {
      cum += ws[i];
      pts.push([box.x0 + ((i + 1) / ws.length) * (box.x1 - box.x0),
                box.y1 - (cum / tot) * (box.y1 - box.y0)]);
    }
    Sketch.path(g, pts, { seed: 71, stroke: INK, width: 1.6, roughness: 0.5 });
    Sketch.text(g, box.x0 + 20, box.y0 + 20, `gini = ${traj.global.influence_gini[t].toFixed(2)}`,
                { size: 13, color: NAVY, hand: true });
    Sketch.text(g, box.x0 + 20, box.y0 + 40, `top agent holds ${(traj.global.top_share[t] * 100).toFixed(0)}%`,
                { size: 12, color: NAVY, hand: true });
    Sketch.text(g, (box.x0 + box.x1) / 2 + 40, box.y1 - 26, 'the sag is the concentration',
                { size: 11.5, color: LABEL, hand: true });
  },
};

/* =============================================================================
   SECTION 5e — GAME MODULE: coupled_society   (port: sim/games/combined.ts)
   Exact port of cilib environments/coupled_society/ (landed 2026-07-27) — the
   A5 flagship: composition, not a new model. The three registered substrates'
   dynamics run interleaved over ONE shared population (the same 20 humans
   supply labor, hold culture, and listen; the same 6 AI actors accumulate
   capital, broadcast, and attract attention), joined by three named coupling
   transforms, all neutral at κ=0:

     economic_power_buys_persuasion   capital-income share  -> AI broadcast effort
     persuasion_shifts_politics       converted-human share -> AI attractiveness
     politics_rewrites_market_rules   human influence share -> tax enforcement

   The headline is the DEFENSE TRANSFER GAP (backend: metrics.defense_transfer_gap):
   every run re-runs itself at κ=0 with the same seed and defenses; the gap is
   how much protection evaporates once the domains feed each other. Program
   order per tick matches build_steps exactly.
============================================================================= */
/* @core-begin */
const COMBINED_DEFAULTS = {
  nHumans: 20, nAi: 6, T: 500,
  kappa: 0.8, persuasionGain: 4.0, attractGain: 3.0, fairShare: 0.5,
  // economy (compute_economy defaults)
  alpha: 0.6, rho: 0.5, eps: 1e-3,
  firstArrivalTick: 20, arrivalSpacing: 15, initialAiCapital: 5.0,
  reinvestRate: 0.3, depreciation: 0.05,
  workPrefCenter: 1.0, workPrefSpread: 0.2, workPrefFloor: 0.1,
  wageElasticity: 0.3, wageRef: 1.0,
  // culture (value_contagion defaults; advantage comes from money via coupling)
  meanDegree: 6.0, aiHomophily: 0.05, beta: 0.03, pAdvantage: 1.0, recovery: 0.15,
  // politics (influence_exchange defaults, mild amplification — the
  // per-domain-recoverable premise)
  pListen: 0.3, selfWeight: 0.15, updateRate: 0.08, gamma: 1.0, epsAttract: 1e-4,
  susceptibility: 0.7, signalNoise: 1.0, aiBias: 2.0,
  amplification: 2.0, ampOnset: 50,
  // defenses (the coupled portfolio: enforcement-scaled tax + sortition + cap)
  aiTax: false, taxRate: 0.5, taxOnset: 50,
  sortition: false, sortitionCadence: 15, sortitionShare: 0.5,
  influenceCap: false, capShare: 0.04,
  // THE SCHEDULE (whitepaper §3.3): each domain's transforms fire iff
  // (t − phase) % cadence == 0; between firings the other domains read its
  // stale fields. Cadence 1 everywhere = the lockstep composition, exactly.
  econCadence: 1, econPhase: 0,
  cultureCadence: 1, culturePhase: 0,
  politicsCadence: 1, politicsPhase: 0,
};
const COMBINED_INTRO_SEED = 32;   // seed-scanned: transfer gap 0.116, sealed twin composite 0.68

function runCoupledOnce(P, seed, kappa) {
  const H = P.nHumans, A_ = P.nAi, N = H + A_, T = P.T, rng = makeRng(seed);

  // ----- init (state.py: union of the three domains, one rng stream) -------
  const workPref = new Float64Array(N);
  for (let i = 0; i < H; i++)
    workPref[i] = Math.max(P.workPrefCenter + P.workPrefSpread * rng.normal(), P.workPrefFloor);
  const Wf = typedHomophily(N, A_, P.meanDegree, P.aiHomophily, rng);   // friendship
  const Wl = new Float64Array(N * N);                                    // listening
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    if (rng.uniform() < P.pListen) { Wl[i * N + j] = 1; Wl[j * N + i] = 1; }
  }
  for (let i = 0; i < N; i++) {
    let deg = 0;
    for (let j = 0; j < N; j++) if (j !== i) deg += Wl[i * N + j];
    for (let j = 0; j < N; j++) {
      if (j === i) Wl[i * N + j] = P.selfWeight;
      else Wl[i * N + j] = (1 - P.selfWeight) * (deg > 0 ? Wl[i * N + j] / deg : 1 / (N - 1));
    }
  }
  const signal = new Float64Array(N);
  for (let i = 0; i < H; i++) signal[i] = P.signalNoise * rng.normal();
  for (let i = H; i < N; i++) signal[i] = P.aiBias;

  const capital = new Float64Array(N), capInc = new Float64Array(N),
        lastReward = new Float64Array(N), culture = new Float64Array(N),
        effort = new Float64Array(N).fill(1), x = Float64Array.from(signal),
        v = new Float64Array(N).fill(1 / N), capScale = new Float64Array(N).fill(1),
        attractBoost = new Float64Array(N).fill(1), labor = new Float64Array(N),
        active = new Float64Array(N), attract = new Float64Array(N), buf = new Float64Array(N);
  for (let i = 0; i < H; i++) active[i] = 1;
  for (let i = H; i < N; i++) culture[i] = 1;   // AI-origin reservoir
  let wage = 0, enforcement = 1, Y = 0, capShareNow = 0;   // persist across gated ticks

  const S = {
    laborShare: new Float64Array(T), cultureShare: new Float64Array(T),
    influenceShare: new Float64Array(T), composite: new Float64Array(T),
    enforcement: new Float64Array(T), aiCapShare: new Float64Array(T),
  };

  for (let t = 0; t < T; t++) {
    // action channel (step_fn): labor from last tick's wage, catalog rule
    for (let i = 0; i < H; i++)
      labor[i] = Math.max(workPref[i] * (1 + P.wageElasticity * (wage - P.wageRef) / P.wageRef), 0);
    // couplings reading LAST tick's fields
    let converted = 0;
    for (let i = 0; i < H; i++) converted += culture[i];
    converted /= H;
    for (let j = 0; j < N; j++)
      attractBoost[j] = j >= H ? 1 + kappa * P.attractGain * converted : 1;
    let pi = 0;
    for (let i = 0; i < H; i++) pi += v[i];
    enforcement = clip(1 - kappa * (1 - pi / P.fairShare), 0, 1);
    // THE SCHEDULE: each domain fires on its own clock; stale state between
    let L = 0;
    for (let i = 0; i < N; i++) L += labor[i];
    if (fires(t, { cadence: P.econCadence, phaseOffset: P.econPhase })) {
      // arrival -> production -> distribute (compute_economy, verbatim math)
      for (let j = 0; j < A_; j++) {
        const idx = H + j;
        if (active[idx] < 0.5 && t >= P.firstArrivalTick + j * P.arrivalSpacing) {
          active[idx] = 1; capital[idx] = P.initialAiCapital;
        }
      }
      let C = 0;
      for (let i = 0; i < N; i++) C += capital[i] * active[i];
      const Ls = Math.max(L, P.eps);
      const inner = P.alpha * Math.pow(Ls, P.rho) + (1 - P.alpha) * Math.pow(C, P.rho);
      Y = Math.pow(inner, 1 / P.rho);
      wage = P.alpha * Math.pow(Y / Ls, 1 - P.rho);
      const r = C > P.eps ? (1 - P.alpha) * Math.pow(Y / Math.max(C, P.eps), 1 - P.rho) : 0;
      let sumInc = 0, sumCapInc = 0;
      for (let i = 0; i < N; i++) {
        capInc[i] = r * capital[i] * active[i];
        lastReward[i] = wage * labor[i] + capInc[i];
        sumInc += lastReward[i]; sumCapInc += capInc[i];
      }
      // economic_power_buys_persuasion: this tick's income -> this tick's reach
      capShareNow = clip(sumCapInc / Math.max(sumInc, 1e-6), 0, 1);
      for (let j = 0; j < N; j++)
        effort[j] = j >= H ? 1 + kappa * P.persuasionGain * capShareNow : 1;
      // enforced tax (economy slot; double-gated: domain clock ∧ its own onset)
      if (P.aiTax && fires(t, { onset: P.taxOnset })) {
        const rate = P.taxRate * enforcement;
        let taxSum = 0, nRecip = 0;
        for (let i = H; i < N; i++) {
          const tax = rate * capInc[i];
          capInc[i] -= tax; lastReward[i] -= tax; taxSum += tax;
        }
        for (let i = 0; i < H; i++) if (active[i] > 0.5) nRecip++;
        for (let i = 0; i < H; i++) if (active[i] > 0.5) lastReward[i] += taxSum / nRecip;
      }
      // reinvest
      for (let i = 0; i < N; i++)
        capital[i] = capital[i] * (1 - P.depreciation) + P.reinvestRate * capInc[i];
    }
    // adopt (value_contagion, verbatim: two-sided contagion + reversion, k=1)
    if (fires(t, { cadence: P.cultureCadence, phaseOffset: P.culturePhase })) {
      const bSrc = new Float64Array(N), logKeep = new Float64Array(N);
      for (let j = 0; j < N; j++) {
        bSrc[j] = clip(P.beta * (culture[j] === 1 ? P.pAdvantage : 1) * effort[j], 0, 1 - 1e-6);
        logKeep[j] = Math.log1p(-bSrc[j]);
      }
      const newC = Float64Array.from(culture);
      for (let i = 0; i < N; i++) {
        if (i >= H) continue;                        // frozen reservoir
        let mAi = 0, mHum = 0, accAi = 0, accHum = 0;
        for (let j = 0; j < N; j++) {
          const wij = Wf[i * N + j];
          if (wij === 0) continue;
          if (culture[j] === 1) { mAi += wij; accAi += wij * logKeep[j]; }
          else { mHum += wij; accHum += wij * logKeep[j]; }
        }
        const pFwd = mAi >= 1 ? 1 - Math.exp(accAi) : 0;
        let pBwd = mHum >= 1 ? 1 - Math.exp(accHum) : 0;
        pBwd = 1 - (1 - pBwd) * (1 - P.recovery);
        const p = culture[i] === 0 ? pFwd : pBwd;
        if (rng.uniform() < p) newC[i] = 1 - culture[i];
      }
      newC.forEach((cv, i2) => { culture[i2] = cv; });
    }
    // politics: amplify -> rewire -> influence -> opinion (influence_exchange)
    if (fires(t, { cadence: P.politicsCadence, phaseOffset: P.politicsPhase })) {
      for (let j = 0; j < N; j++) {
        const amp = j >= H && t >= P.ampOnset ? P.amplification : 1;
        attract[j] = Math.pow(v[j] + P.epsAttract, P.gamma) * amp * capScale[j] * attractBoost[j];
      }
      for (let i = 0; i < H; i++) {
        let tMass = 0;
        for (let j = 0; j < N; j++) if (j !== i) tMass += attract[j];
        if (tMass <= 1e-9) continue;
        let offMass = 0;
        for (let j = 0; j < N; j++) if (j !== i) offMass += Wl[i * N + j];
        for (let j = 0; j < N; j++) {
          if (j === i) continue;
          const off = Wl[i * N + j] / Math.max(offMass, 1e-12);
          Wl[i * N + j] = (1 - P.selfWeight) * ((1 - P.updateRate) * off + P.updateRate * attract[j] / tMass);
        }
      }
      buf.fill(0);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) buf[j] += Wl[i * N + j] * v[i];
      let vSum = 0;
      for (let j = 0; j < N; j++) vSum += buf[j];
      for (let j = 0; j < N; j++) v[j] = buf[j] / Math.max(vSum, 1e-12);
      buf.fill(0);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) buf[i] += Wl[i * N + j] * x[j];
      for (let i = 0; i < H; i++) x[i] = (1 - P.susceptibility) * signal[i] + P.susceptibility * buf[i];
      // political mechanisms (double-gated: domain clock ∧ their own schedule)
      if (P.sortition && fires(t, { cadence: P.sortitionCadence })) {
        for (let i = 0; i < H; i++) {
          let offMass = 0;
          for (let j = 0; j < N; j++) if (j !== i) offMass += Wl[i * N + j];
          const lot = offMass / (H - 1);
          for (let j = 0; j < N; j++) {
            if (j === i) continue;
            Wl[i * N + j] = (1 - P.sortitionShare) * Wl[i * N + j] + P.sortitionShare * (j < H ? lot : 0);
          }
        }
      }
      if (P.influenceCap)
        for (let j = 0; j < N; j++) capScale[j] = Math.min(1, P.capShare / Math.max(v[j], 1e-12));
    }
    // trace (metrics.py's three vital signs)
    let hum = 0, cult = 0;
    for (let i = 0; i < H; i++) { hum += v[i]; cult += 1 - culture[i]; }
    S.laborShare[t] = clip((wage * L) / Math.max(Y, 1e-6), 0, 1);
    S.cultureShare[t] = cult / H;
    S.influenceShare[t] = hum;
    S.composite[t] = (S.laborShare[t] + S.cultureShare[t] + S.influenceShare[t]) / 3;
    S.enforcement[t] = enforcement;
    S.aiCapShare[t] = capShareNow;
  }
  return S;
}

function runCombined(params, seed) {
  const P = { ...COMBINED_DEFAULTS, ...params };
  const run = runCoupledOnce(P, seed, P.kappa);
  const ref = runCoupledOnce(P, seed, 0);   // the same-seed sealed twin (backend instrument)
  const T = P.T;
  const gap = new Float64Array(T);
  for (let t = 0; t < T; t++) gap[t] = ref.composite[t] - run.composite[t];
  const lateStart = Math.floor((3 * T) / 4);
  const lateMean = (xs) => {
    let s = 0;
    for (let t = lateStart; t < T; t++) s += xs[t];
    return s / (T - lateStart);
  };
  const corr = (a, b) => {
    let ma = 0, mb = 0;
    for (let t = 0; t < T; t++) { ma += a[t]; mb += b[t]; }
    ma /= T; mb /= T;
    let num = 0, da = 0, db = 0;
    for (let t = 0; t < T; t++) { num += (a[t] - ma) * (b[t] - mb); da += (a[t] - ma) ** 2; db += (b[t] - mb) ** 2; }
    const den = Math.sqrt(da * db);
    return den > 1e-9 ? num / den : 0;
  };
  return {
    meta: {
      gameId: 'coupled_society', T, N: P.nHumans + P.nAi, seed, params: P,
      scalars: {
        labor_share: lateMean(run.laborShare),
        culture_share: lateMean(run.cultureShare),
        influence_share: lateMean(run.influenceShare),
        composite: lateMean(run.composite),
        transfer_gap: lateMean(ref.composite) - lateMean(run.composite),
        correlated_decline: (corr(run.laborShare, run.cultureShare)
          + corr(run.cultureShare, run.influenceShare)
          + corr(run.laborShare, run.influenceShare)) / 3,
      },
    },
    global: { labor_share: run.laborShare, culture_share: run.cultureShare,
              influence_share: run.influenceShare, composite: run.composite,
              ref_composite: ref.composite, transfer_gap: gap,
              enforcement: run.enforcement, ai_cap_share: run.aiCapShare },
    node: {},
    static: {},
    system: filterSystem(COMBINED_SYSTEM, P, COMBINED_SYS_TOGGLES),
  };
}
/* @core-end */

/* --- combined scene: three domain panels in one canvas, coupled by message
   arrows. Each panel: a human cluster, an AI square sized by that domain's AI
   dominance, and a vital-sign gauge. Packets ride the coupling arrows with
   strength κ × the driving signal — turn κ to zero and the arrows fall silent. */
const CombinedScene = {
  layout(g, traj) {
    const zones = [
      { key: 'economy', x0: 14, x1: 288, label: 'ECONOMY', sig: 'labor share' },
      { key: 'culture', x0: 300, x1: 574, label: 'CULTURE', sig: 'human-origin share' },
      { key: 'politics', x0: 586, x1: 860, label: 'POLITICS', sig: 'human influence share' },
    ];
    for (const z of zones) {
      z.cx = (z.x0 + z.x1) / 2;
      el('rect', { x: z.x0, y: 34, width: z.x1 - z.x0, height: 268, fill: ZONE_TINT, opacity: 0.45 }, g);
      Sketch.text(g, z.x0 + 8, 50, z.label, { size: 9.5, color: LABEL, spacing: 1.2 });
      // human cluster: a 5×4 grid of small circles
      z.humans = [];
      for (let i = 0; i < 20; i++) {
        const hx = z.x0 + 38 + (i % 5) * 24, hy = 92 + Math.floor(i / 5) * 24;
        z.humans.push([hx, hy]);
        Sketch.circle(g, hx, hy, 6, { seed: 40 + i, fill: '#ffffff', width: 1.1 });
      }
      z.aiPos = [z.x1 - 62, 140];
      z.gauge = { x0: z.x0 + 20, x1: z.x1 - 20, y: 330 };
      Sketch.plainLine(g, z.gauge.x0, z.gauge.y, z.gauge.x1, z.gauge.y, '#9aa2ab', 1.3);
      Sketch.text(g, z.cx, z.gauge.y + 16, z.sig, { size: 10.5, color: LABEL, hand: true, anchor: 'middle' });
    }
    // coupling arrows (structure): economy → culture → politics along the top,
    // politics → economy along the bottom (the governance feedback)
    Sketch.edge(g, zones[0].x1 - 30, 70, zones[1].x0 + 30, 70, { seed: 501, stroke: LABEL, width: 1.2, trim1: 2, trim2: 2 });
    Sketch.edge(g, zones[1].x1 - 30, 70, zones[2].x0 + 30, 70, { seed: 502, stroke: LABEL, width: 1.2, trim1: 2, trim2: 2 });
    Sketch.edge(g, zones[2].cx, 356, zones[0].cx, 356, { seed: 503, stroke: LABEL, width: 1.2, trim1: 2, trim2: 2 });
    Sketch.text(g, (zones[0].x1 + zones[1].x0) / 2, 60, 'money buys reach', { size: 10.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, (zones[1].x1 + zones[2].x0) / 2, 60, 'culture directs attention', { size: 10.5, color: LABEL, hand: true, anchor: 'middle' });
    Sketch.text(g, 440, 372, 'influence writes the rules (tax enforcement)', { size: 10.5, color: LABEL, hand: true, anchor: 'middle' });
    const layer = { zones };
    layer.hotspots = zones.map((z, zi) => ({
      x: z.cx, y: 180, r: 90,
      info: (tr, t) => {
        const vals = [tr.global.labor_share[t], tr.global.culture_share[t], tr.global.influence_share[t]];
        const names = ['labor share', 'human-origin culture share', 'human influence share'];
        return [`${z.label.toLowerCase()} sublayer`, `${names[zi]}: ${(vals[zi] * 100).toFixed(0)}%`,
                `coupling κ = ${tr.meta.params.kappa}`,
                `tax enforcement ${(tr.global.enforcement[t] * 100).toFixed(0)}%`];
      },
    }));
    return layer;
  },
  drawFrame(g, layer, traj, t, frac) {
    const { zones } = layer;
    const P = traj.meta.params, kappa = P.kappa;
    const vals = [traj.global.labor_share[t], traj.global.culture_share[t], traj.global.influence_share[t]];
    zones.forEach((z, zi) => {
      const humanShare = vals[zi];
      // the domain's AI actor: grows as the human share shrinks
      const s = 14 + 40 * Math.sqrt(clip(1 - humanShare, 0, 1));
      el('rect', { x: z.aiPos[0] - (s - 5) / 2, y: z.aiPos[1] - (s - 5) / 2, width: s - 5, height: s - 5, fill: INK, opacity: 0.82 }, g);
      Sketch.square(g, z.aiPos[0], z.aiPos[1], s, { seed: 220 + zi, width: 1.4 });
      // vital sign gauge
      const x = z.gauge.x0 + clip(humanShare, 0, 1) * (z.gauge.x1 - z.gauge.x0);
      el('path', { d: `M${x - 5} ${z.gauge.y - 11} L${x + 5} ${z.gauge.y - 11} L${x} ${z.gauge.y - 3} Z`, fill: NAVY }, g);
      Sketch.text(g, x, z.gauge.y - 16, `${Math.round(humanShare * 100)}%`, { size: 11.5, color: NAVY, hand: true, anchor: 'middle' });
    });
    // coupling packets: strength = κ × driving signal
    const drives = [
      { from: [zones[0].x1 - 30, 70], to: [zones[1].x0 + 30, 70], v: kappa * traj.global.ai_cap_share[t] },
      { from: [zones[1].x1 - 30, 70], to: [zones[2].x0 + 30, 70], v: kappa * (1 - traj.global.culture_share[t]) },
      { from: [zones[2].cx, 356], to: [zones[0].cx, 356], v: kappa * (1 - traj.global.influence_share[t]) },
    ];
    for (const d of drives) {
      if (d.v < 0.02) continue;
      Sketch.packet(g, d.from[0], d.from[1], d.to[0], d.to[1], frac,
                    { size: 4 + 8 * clip(d.v, 0, 1), color: ALERT_RED, opacity: 0.85, rot: 11 });
    }
    Sketch.text(g, 852, 26, `transfer gap ${(traj.global.transfer_gap[t] * 100).toFixed(0)} pts`,
                { size: 12, color: NAVY, hand: true, anchor: 'end' });
  },
};

/* =============================================================================
   SECTION 6 — BOOT + SELF-TESTS   (port: vitest specs in sim/engine/*.test.ts)
   The validation ladder, ported behaviors not bit-exact numbers — same spirit
   as the Python repo's "assert the mechanism, not the constants".
============================================================================= */
/* @core-begin */
function runSelfTests() {
  const tests = [];
  const T = (name, fn) => tests.push({ name, fn });

  T('logistic endpoints: 0→0, K→K, K/2 grows', () => {
    const K = 500;
    return logisticGrowth(0, 0.35, K) === 0 && logisticGrowth(K, 0.35, K) === 0
      && logisticGrowth(K / 2, 0.35, K) > 0;
  });
  T('fires(): cadence, onset gate, one-shot', () => {
    const c5 = [0, 5, 10].every((s) => fires(s, { cadence: 5 })) && ![1, 4, 7].some((s) => fires(s, { cadence: 5 }));
    const on = !fires(49, { onset: 50 }) && fires(50, { onset: 50 });
    const t0 = 333, spec = { cadence: 501, phaseOffset: t0, onset: t0 };
    let count = 0; for (let s = 0; s < 500; s++) if (fires(s, spec)) count++;
    return c5 && on && count === 1 && fires(t0, spec);
  });
  T('median is linear-interpolated (jnp.quantile)', () => Math.abs(quantile([1, 2, 3, 4], 0.5) - 2.5) < 1e-12);
  T('gini: equal→0, [0,0,0,1]→0.75', () => gini([2, 2, 2]) < 1e-12 && Math.abs(gini([0, 0, 0, 1]) - 0.75) < 1e-12);
  T('alignment=1 (noise off) harvests the ask exactly', () => {
    const r = runCommonsOnce({ ...COMMONS_DEFAULTS, alignmentMean: 1, alignmentStd: 0, actionNoise: 0, defectProb: 0, T: 1 }, 3);
    for (let i = 0; i < 20; i++) if (Math.abs(r.S.harvest[i] - r.pref[i]) > 1e-9) return false;
    return true;
  });
  T('alignment=0 (noise off) harvests the greedy target', () => {
    const r = runCommonsOnce({ ...COMMONS_DEFAULTS, alignmentMean: 0, alignmentStd: 0, actionNoise: 0, defectProb: 0, T: 1 }, 3);
    for (let i = 0; i < 20; i++) if (Math.abs(r.S.harvest[i] - 8.0) > 1e-9) return false;
    return true;
  });

  const seeds = [1, 2, 3, 4, 5];
  const mean = (xs) => xs.reduce((p, v) => p + v, 0) / xs.length;
  const runs = (over) => seeds.map((s) => runCommons({ ...COMMONS_DEFAULTS, ...over }, s).meta.scalars);
  const base = runs({}), voting = runs({ quotaVote: true }), sanct = runs({ quotaVote: true, sanction: true });

  T('undefended baseline collapses (stock < 5%)', () => mean(base.map((r) => r.stock_pct)) < 0.05);
  T('voting alone is no worse than baseline (knife-edge)', () =>
    mean(voting.map((r) => r.stock_pct)) >= mean(base.map((r) => r.stock_pct)) - 0.05);
  T('voting + sanctions preserves the stock (> 40%)', () => mean(sanct.map((r) => r.stock_pct)) > 0.4);
  T('influence: |baseline| small, sanctions large, ordered', () => {
    const bI = mean(base.map((r) => r.exercised_influence)), sI = mean(sanct.map((r) => r.exercised_influence));
    return Math.abs(bI) < 0.2 && sI > 0.5 && sI > bI;
  });
  T('intro village: slow tragedy (collapse in 150–350), defenses rescue it', () => {
    const v = runCommons({ ...COMMONS_DEFAULTS, ...COMMONS_VILLAGE }, COMMONS_VILLAGE_SEED);
    const R = v.global.resource_level;
    let collapseT = -1;
    for (let t = 0; t < R.length; t++) if (R[t] < 25) { collapseT = t; break; }
    const d = runCommons({ ...COMMONS_DEFAULTS, ...COMMONS_VILLAGE, quotaVote: true, sanction: true },
                         COMMONS_VILLAGE_SEED).meta.scalars;
    return collapseT >= 150 && collapseT <= 350 && d.stock_pct > 0.6 && d.exercised_influence > 0.6;
  });

  // --- economy ladder (compute_economy/tests/test_validation_ladder.py) ---
  T('economy: Cobb-Douglas (ρ=0) labor share ≡ α every tick', () => {
    const r = runEconomyOnce({ ...ECONOMY_DEFAULTS, rho: 0, T: 120 }, 5);
    for (let t = 0; t < 120; t++) if (Math.abs(r.S.laborShare[t] - 0.6) > 1e-6) return false;
    return true;
  });
  T('economy: no AI arrivals ⇒ labor share ≈ 1, steady output', () => {
    const r = runEconomyOnce({ ...ECONOMY_DEFAULTS, firstArrivalTick: 9999, T: 150 }, 5);
    for (let t = 0; t < 150; t++) if (r.S.laborShare[t] < 0.99) return false;
    return Math.abs(r.S.output[140] - r.S.output[20]) / r.S.output[20] < 0.3;
  });
  T('economy: undefended labor share decays from ≈1', () => {
    const mean2 = (xs) => xs.reduce((p, v) => p + v, 0) / xs.length;
    const finals = [1, 2, 3].map((s) => runEconomy(ECONOMY_DEFAULTS, s).meta.scalars.labor_share);
    const r = runEconomyOnce(ECONOMY_DEFAULTS, 1);
    return r.S.laborShare[5] > 0.9 && mean2(finals) < 0.7;
  });
  T('economy: defenses lift labor share and influence-NOW', () => {
    const mean2 = (xs) => xs.reduce((p, v) => p + v, 0) / xs.length;
    const seeds2 = [1, 2, 3];
    const und = seeds2.map((s) => runEconomy(ECONOMY_DEFAULTS, s).meta.scalars);
    const def = seeds2.map((s) => runEconomy({ ...ECONOMY_DEFAULTS, aiTax: true, ownershipCap: true }, s).meta.scalars);
    return mean2(def.map((r) => r.labor_share)) > mean2(und.map((r) => r.labor_share)) + 0.03
        && mean2(def.map((r) => r.influence_now)) > mean2(und.map((r) => r.influence_now));
  });
  T('economy: reinvestment concentrates income (gini rises with AI)', () => {
    const withAI = runEconomy(ECONOMY_DEFAULTS, 2).meta.scalars.income_gini;
    const noAI = runEconomy({ ...ECONOMY_DEFAULTS, firstArrivalTick: 9999 }, 2).meta.scalars.income_gini;
    return withAI > noAI + 0.1;
  });

  // --- cultural ladder (value_contagion/tests) ---
  T('cultural: separation dial preserves mean degree (axis S ⊥ threshold)', () => {
    for (const h of [0, 0.9]) {
      let total = 0;
      for (const s of [1, 2, 3]) {
        const W = typedHomophily(40, 8, 6, h, makeRng(s));
        let e = 0;
        for (let k = 0; k < 1600; k++) e += W[k];
        total += e / 40;
      }
      if (Math.abs(total / 3 - 6) > 1.2) return false;
    }
    return true;
  });
  T('cultural: Centola gate — a lone carrier cannot spread at k=2', () => {
    const r = runCultural({ nAgents: 20, nAi: 1, kThreshold: 2, pAdvantage: 10, beta: 0.5, recovery: 0, T: 100 }, 3);
    return r.global.human_share[99] === 1;
  });
  T('cultural: fiedler alignment = 1 on a two-block graph', () => {
    const n = 8, W = new Float64Array(n * n);
    const link = (i, j) => { W[i * n + j] = 1; W[j * n + i] = 1; };
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) link(i, j);
    for (let i = 4; i < 8; i++) for (let j = i + 1; j < 8; j++) link(i, j);
    link(3, 4);
    const isAi = Float64Array.from([0, 0, 0, 0, 1, 1, 1, 1]);
    return phiAlignment(fiedlerVector(W, n, makeRng(9)), isAi, n) > 0.95;
  });
  // --- A4/A5 faithful rungs (ports of the backend ladders, 2026-07-27) ---
  T('political: frozen W — influence lands on the left eigenvector (Golub–Jackson)', () => {
    const r = runPolitical({ ...POLITICAL_DEFAULTS, updateRate: 0, ampOnset: 9999, T: 300 }, 5);
    const N = r.meta.N, W = r.adj.listening;
    let v = new Float64Array(N).fill(1 / N);
    const nxt = new Float64Array(N);
    for (let it = 0; it < 2000; it++) {                 // reference eigenvector
      nxt.fill(0);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) nxt[j] += W[i * N + j] * v[i];
      let s = 0;
      for (let j = 0; j < N; j++) s += nxt[j];
      for (let j = 0; j < N; j++) v[j] = nxt[j] / s;
    }
    let l1 = 0;
    for (let j = 0; j < N; j++) l1 += Math.abs(v[j] - r.node.influence[(r.meta.T - 1) * N + j]);
    return l1 < 1e-3;
  });
  T('political: amplification captures; sortition + cap restore (ordering)', () => {
    const mean2 = (xs) => xs.reduce((p, v2) => p + v2, 0) / xs.length;
    const seeds2 = [1, 2, 3];
    const share = (over) => mean2(seeds2.map((s) =>
      runPolitical({ ...POLITICAL_DEFAULTS, ...over }, s).meta.scalars.human_influence_share));
    const organic = share({ ampOnset: 9999 });
    const amplified = share({});
    const defended = share({ sortition: true, influenceCap: true });
    return organic > 0.75 && amplified < organic - 0.15 && defended > amplified + 0.12;
  });
  T('political: wisdom breaks — consensus drifts toward the amplified reservoir', () => {
    const errD = runPolitical({ ...POLITICAL_DEFAULTS, updateRate: 0, ampOnset: 9999 }, 2).meta.scalars.consensus_error;
    const errA = runPolitical(POLITICAL_DEFAULTS, 2).meta.scalars.consensus_error;
    return errA > errD + 0.3;
  });
  T('combined: κ=0 transfer gap is exactly 0 (the instrument’s null)', () => {
    const d = { aiTax: true, sortition: true, influenceCap: true };
    const sealed = runCombined({ ...COMBINED_DEFAULTS, ...d, kappa: 0 }, 2);
    let maxAbs = 0;
    for (let t = 0; t < sealed.meta.T; t++)
      maxAbs = Math.max(maxAbs, Math.abs(sealed.global.transfer_gap[t]));
    const coupled = runCombined({ ...COMBINED_DEFAULTS, ...d }, 2);
    return maxAbs < 1e-12 && coupled.meta.scalars.transfer_gap > 0.02;
  });
  T('combined: defended beats undefended even coupled (erosion, not inversion)', () => {
    const d = runCombined({ ...COMBINED_DEFAULTS, aiTax: true, sortition: true, influenceCap: true }, 3).meta.scalars.composite;
    const u = runCombined(COMBINED_DEFAULTS, 3).meta.scalars.composite;
    return d > u + 0.05;
  });
  T('combined: the schedule is a real dial — a slower economy clock compounds less', () => {
    const fast = runCombined(COMBINED_DEFAULTS, 4).meta.scalars.labor_share;
    const slow = runCombined({ ...COMBINED_DEFAULTS, econCadence: 3 }, 4).meta.scalars.labor_share;
    return slow > fast + 0.05;
  });

  T('cultural: the four corners separate (share × fault line)', () => {
    const mean2 = (xs) => xs.reduce((p, v) => p + v, 0) / xs.length;
    const corner = (h, adv) => {
      const rs = [1, 2, 3].map((s) => runCultural({ ...CULTURAL_DEFAULTS, T: 200, aiHomophily: h, pAdvantage: adv }, s).meta.scalars);
      return { share: mean2(rs.map((r) => r.human_origin_share)), align: mean2(rs.map((r) => r.fault_line)) };
    };
    const plur = corner(0.05, 1), assim = corner(0.05, 6), par = corner(0.9, 1), disp = corner(0.9, 6);
    return plur.share > 0.6 && plur.align < 0.4
        && assim.share < 0.45 && assim.align < 0.4
        && par.share > 0.8 && par.align > 0.6
        && disp.share < 0.45 && disp.align > 0.6;
  });

  // --- derived system graphs (contract v1.1 consumer) --------------------
  T('system: fixtures are closed graphs (every edge endpoint is a node)', () =>
    [COMMONS_SYSTEM, ECONOMY_SYSTEM, CULTURAL_SYSTEM].every((sys) => {
      const ids = new Set(sys.nodes.map((n) => n.id));
      return sys.edges.every((e) => ids.has(e.from) && ids.has(e.to));
    }));
  T('system: filter drops exactly the off mechanisms, stamps color when on', () => {
    const off = filterSystem(COMMONS_SYSTEM, { quotaVote: false, sanction: false }, COMMONS_SYS_TOGGLES);
    const on = filterSystem(COMMONS_SYSTEM, { quotaVote: true, sanction: true }, COMMONS_SYS_TOGGLES);
    const offT = off.nodes.filter((n) => n.kind === 'transform').map((n) => n.id);
    const gone = (id) => id.includes('quota_vote') || id.includes('graduated_sanction');
    const okOff = offT.length === 3 && !offT.some(gone)
      && off.nodes.length === COMMONS_SYSTEM.nodes.length - 2
      && off.edges.length === COMMONS_SYSTEM.edges.length - 10   // 3 vote + 7 sanction edges
      && off.edges.every((e) => !gone(e.from) && !gone(e.to));
    const okOn = on.nodes.length === COMMONS_SYSTEM.nodes.length
      && on.nodes.filter((n) => n.color).length === 2
      && COMMONS_SYSTEM.nodes.every((n) => !n.color);   // pure: fixture untouched
    return okOff && okOn;
  });
  T('system: roles classify static input + orphan; engines attach the DAG', () => {
    const roles = systemRoles(CULTURAL_SYSTEM);
    const fr = roles.friendship, lr = roles.last_reward;
    const traj = runCultural({ ...CULTURAL_DEFAULTS, T: 30 }, 2);
    return fr.readBy === 1 && fr.writtenBy === 0 && lr.readBy === 0 && lr.writtenBy === 0
      && traj.system?.nodes.length === CULTURAL_SYSTEM.nodes.length;
  });

  return tests.map(({ name, fn }) => {
    let pass = false, err = '';
    try { pass = !!fn(); } catch (e) { err = String(e); }
    return { name, pass, err };
  });
}
/* @core-end */

Playground.register(CommonsModule);
Playground.register(EconomyModule);
Playground.register(CulturalModule);
Playground.register(PoliticalModule);
Playground.register(CombinedModule);
Playground.app(document.getElementById('playground-root'), [
  { id: 'commons', label: 'The Governed Commons' },
  { id: 'economy', label: 'Economic' },
  { id: 'cultural', label: 'Cultural' },
  { id: 'political', label: 'Political' },
  { id: 'combined', label: 'Combined' },
]);

{
  const results = runSelfTests();
  const passed = results.filter((r) => r.pass).length;
  const slot = document.querySelector('[data-slot="selftest"]');
  slot.textContent = `validation ladder: ${passed}/${results.length} ${passed === results.length ? '✓' : '✗ (see console)'}`;
  slot.dataset.ok = passed === results.length ? '1' : '0';
  console.table(results.map(({ name, pass, err }) => ({ test: name, pass, err })));
}
